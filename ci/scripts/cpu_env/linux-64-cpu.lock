# The CPU test environment this fork is verified in, as an explicit package list: micromamba 2.9.0 on linux-64,
# python 3.12, morpheus-core 25.06 from rapidsai with its compiled library, pytest, yapf and pylint, every
# dependency pinned to the build that was solved here. .github/workflows/fork-cpu.yaml creates the runner's
# environment from this file, so CI runs the environment the tests were written against rather than whatever the
# channels solve to on the day; a fresh solve in CI picked a libarrow build without libgflags and pyarrow would not
# import. Regenerate with:
#   micromamba env export -n morpheus --explicit > ci/scripts/cpu_env/linux-64-cpu.lock
# after creating the environment with:
#   micromamba create -n morpheus -c conda-forge -c rapidsai -c nvidia python=3.12 morpheus-core=25.06 pytest pytest-asyncio yapf pylint
# platform: linux-64
