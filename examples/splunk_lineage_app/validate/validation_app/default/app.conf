#
# Validation only. docker-compose.yml mounts this beside TA-morpheus-lineage so the settings the validation
# container needs live in an app of their own, in its local/ directory, which takes precedence over every app's
# default/. Mounting them inside the shipped app instead needed a mount point inside a read-only mount.

[install]
state = enabled

[ui]
is_visible = false
label = Morpheus lineage validation settings

[launcher]
description = Validation-only settings for the TA-morpheus-lineage search-head run. Never deploy.
version = 1.0.0
