#
# Validation only: part of the morpheus_validation app run_search_head.sh installs beside the shipped one. Never shipped.
#
# run_search_head.py moves every sample event forward by a whole number of weeks so the newest lands a few days
# before the run, which leaves the oldest about sixty days back. That is past the thirty-day MAX_DAYS_AGO the shipped
# app gives edges, quarantined records and health records, and an event outside it is not rejected but quietly given
# another time -- the failure the procedure's first check exists to catch. Every stanza is set here to 400, the
# largest value the shipped app uses, so this app raises the thirty-day ones for this container alone and lowers
# none: a local value outranks the shipped default, and anything smaller would undercut the score stanzas' 395.

[morpheus:score:l1]
MAX_DAYS_AGO = 400

[morpheus:score:l2]
MAX_DAYS_AGO = 400

[morpheus:score:l3]
MAX_DAYS_AGO = 400

[morpheus:score:l4]
MAX_DAYS_AGO = 400

[morpheus:score:l5]
MAX_DAYS_AGO = 400

[morpheus:score:l6]
MAX_DAYS_AGO = 400

[morpheus:score:l7]
MAX_DAYS_AGO = 400

[morpheus:score:host]
MAX_DAYS_AGO = 400

[morpheus:edge]
MAX_DAYS_AGO = 400

[morpheus:quarantine]
MAX_DAYS_AGO = 400

[morpheus:health]
MAX_DAYS_AGO = 400

[morpheus:late]
MAX_DAYS_AGO = 400

[binding:bucketed]
MAX_DAYS_AGO = 400

[binding:l1]
MAX_DAYS_AGO = 400

[binding:l2]
MAX_DAYS_AGO = 400

[binding:l2:open]
MAX_DAYS_AGO = 400

[context:identity]
MAX_DAYS_AGO = 400

[context:asset]
MAX_DAYS_AGO = 400

[context:application]
MAX_DAYS_AGO = 400

[context:network]
MAX_DAYS_AGO = 400
