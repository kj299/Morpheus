#
# Validation only: part of the morpheus_validation app docker-compose.yml mounts beside the shipped one. Never shipped.
#
# run_search_head.py moves every sample event forward by a whole number of weeks so the newest lands a few days
# before the run, which leaves the oldest fifty-seven days back. That is past layer 1's and layer 2's thirty-day
# MAX_DAYS_AGO, and an event outside it is not rejected but quietly given another time -- the failure the
# procedure's first check exists to catch. Raising it here, for this container alone, keeps the shipped value a
# statement about a deployment's backfill rather than about this package's corpus.

[morpheus:score:l1]
MAX_DAYS_AGO = 120

[morpheus:score:l2]
MAX_DAYS_AGO = 120

[morpheus:score:l3]
MAX_DAYS_AGO = 120

[morpheus:score:l4]
MAX_DAYS_AGO = 120

[morpheus:score:l5]
MAX_DAYS_AGO = 120

[morpheus:score:l6]
MAX_DAYS_AGO = 120

[morpheus:score:l7]
MAX_DAYS_AGO = 120

[morpheus:edge]
MAX_DAYS_AGO = 120

[binding:bucketed]
MAX_DAYS_AGO = 120

[binding:l1]
MAX_DAYS_AGO = 120

[binding:l2]
MAX_DAYS_AGO = 120

[binding:l2:open]
MAX_DAYS_AGO = 120

[context:identity]
MAX_DAYS_AGO = 120

[context:asset]
MAX_DAYS_AGO = 120
