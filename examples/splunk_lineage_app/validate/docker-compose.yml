#
# One Splunk instance, the app mounted, and the sample events on disk ready to index.
#
# This exists so the search-head verdict costs minutes rather than an afternoon of setup. It is not a deployment
# topology: a real estate parses on indexers or heavy forwarders and this is one container doing everything.

services:
  splunk:
    image: splunk/splunk:10.2
    container_name: morpheus-lineage-validate
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:-changeme-please}
      # Recent images refuse to start without accepting Splunk's General Terms as well as the license.
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      # The app is mounted rather than copied so an edit to a saved search is one restart away from being tested.
      SPLUNK_APPS_URL: ""
    ports:
      - "8000:8000"   # web
      - "8089:8089"   # management, which VALIDATION.md drives the searches through
    volumes:
      - ../TA-morpheus-lineage:/opt/splunk/etc/apps/TA-morpheus-lineage:ro
      - ./sample_events:/sample_events:ro
      # Validation-only settings, in an app of their own: index paths, and the MAX_DAYS_AGO the dated sample events
      # need. See validation_app/local/props.conf.
      - ./validation_app:/opt/splunk/etc/apps/morpheus_validation:ro
      # The runner, the sample events and the saved searches it reads. Read-only: the runner writes its result
      # inside the container and run_search_head.sh copies it out.
      - ..:/splunk_lineage_app:ro
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:8089/services/server/info"]
      interval: 10s
      timeout: 5s
      retries: 30
