#
# One Splunk instance, with the app, the validation settings and the sample events on disk ready to install and index.
#
# This exists so the search-head verdict costs minutes rather than an afternoon of setup. It is not a deployment
# topology: a real estate parses on indexers or heavy forwarders and this is one container doing everything.

services:
  splunk:
    image: splunk/splunk:10.2
    container_name: morpheus-lineage-validate
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:-changeme-please}
      # Recent images refuse to start without accepting Splunk's General Terms as well as the license.
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_APPS_URL: ""
    ports:
      - "8000:8000"   # web
      - "8089:8089"   # management, which VALIDATION.md drives the searches through
    volumes:
      # The app, the validation-only settings, the sample events and the runner, all read-only and all outside
      # /opt/splunk/etc. The image's provisioning changes the owner of everything under /opt/splunk/etc as it
      # starts, and a read-only mount there stops it with "chown failed: Read-only file system" -- which is how the
      # first attempt at this run ended. run_search_head.sh copies both apps into place once Splunk is up, gives
      # them to the splunk user, and restarts it, so an edit to a saved search is tested by running it again.
      - ..:/splunk_lineage_app:ro
    # No healthcheck of our own. The one this file used to carry called the management port without credentials,
    # which Splunk can refuse, and then the container never reads as healthy. The image ships its own, and
    # run_search_head.sh waits for an authenticated search to succeed instead, which is the readiness that matters.
