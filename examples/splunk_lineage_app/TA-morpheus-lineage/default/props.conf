# Bucketed binding rows produced by BindingTable.to_bucketed_frame() in the
# Morpheus pipeline. The bucket ordinal, not this timestamp, drives the joins;
# _time exists for retention and troubleshooting.
[binding:bucketed]
KV_MODE            = json
SHOULD_LINEMERGE   = false
TRUNCATE           = 0
# A bucketed row is not a binding record; it is one key in one time bucket, and it carries no `bind_start`. Its own
# time is the bucket's start, which `to_bucketed_records` renders as `bucket_start` in this same format. Anchoring
# on a field the row does not carry is the silent failure this app's README warns about: the event would be stamped
# at ingest time, or inherit the timestamp of whatever parsable event preceded it.
TIME_PREFIX        = "bucket_start"\s*:\s*"
TIME_FORMAT        = %Y-%m-%dT%H:%M:%S.%6N%Z
MAX_TIMESTAMP_LOOKAHEAD = 32
MAX_DAYS_AGO       = 400
category           = Custom

# Unbucketed layer 1 bindings (switch port to site, transceiver, LLDP
# neighbor). These are stable for months, so they are not bucket-expanded.
[binding:l1]
KV_MODE            = json
SHOULD_LINEMERGE   = false
TRUNCATE           = 0
TIME_PREFIX        = "bind_start"\s*:\s*"
TIME_FORMAT        = %Y-%m-%dT%H:%M:%S.%6N%Z
MAX_TIMESTAMP_LOOKAHEAD = 32
MAX_DAYS_AGO       = 400
category           = Custom

# Raw closed layer 2 bindings as TC2BindingStage emits them, one record per
# closed interval, before bucket expansion. Unlike the bucketed and L1 binding
# sourcetypes this one anchors _time on bind_end rather than bind_start: the
# record exists because the binding closed, and the detections that read it
# (R-D-L2-004) are about the closing. A binding opened hours ago and closed by
# a conflict now would otherwise land outside every detection window. Render
# bind_end with morpheus.utils.siem_wire.render_event_time_series, exactly as
# event_time is rendered.
[binding:l2]
KV_MODE            = json
SHOULD_LINEMERGE   = false
TRUNCATE           = 0
TIME_PREFIX        = "bind_end"\s*:\s*"
TIME_FORMAT        = %Y-%m-%dT%H:%M:%S.%6N%Z
MAX_TIMESTAMP_LOOKAHEAD = 32
MAX_DAYS_AGO       = 400
category           = Custom

# Provisional open bindings, emitted by TC2BindingStage(emit_open_bindings=True)
# the moment a binding opens, with bind_provisional=true and a null bind_end.
# Timed on bind_start because there is no end yet. These exist so that live
# attribution has an answer inside the idle window; the closed record that
# follows on binding:l2 carries the same mac_address and bind_start and
# supersedes it. Consumers building a live table cap the open interval with an
# explicit assumed duration (BindingTable open_end_duration_ns); nothing here
# invents one.
[binding:l2:open]
KV_MODE            = json
SHOULD_LINEMERGE   = false
TRUNCATE           = 0
TIME_PREFIX        = "bind_start"\s*:\s*"
TIME_FORMAT        = %Y-%m-%dT%H:%M:%S.%6N%Z
MAX_TIMESTAMP_LOOKAHEAD = 32
MAX_DAYS_AGO       = 400
category           = Custom

