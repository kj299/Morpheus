#
# Deploy wherever parsing happens: indexers, or heavy forwarders if they sit in
# front of the indexers.
#
# Every stream is JSON. The line that matters in each stanza is TIME_PREFIX
# anchored to event_time: the envelope carries four timestamps (event_time,
# observed_time, ingest_time, plus Splunk's own _indextime) and Splunk's default
# timestamp discovery will regularly pick the wrong one.
#
# TIME_PREFIX is a regex, and the trailing quote in it is load-bearing: it only
# matches when event_time arrives as a JSON *string*. A raw nanosecond integer
# matches nothing, _time silently falls back to index time, and every windowed
# rule becomes a rule about when the pipeline was busy. Render event_time with
# morpheus.utils.siem_wire.render_event_time before the sink; the \s* allow for
# producers that pretty-print their JSON, which Morpheus itself does not.
#
# MAX_DAYS_AGO must exceed the longest backfill you intend to run, or replayed
# history is quietly rejected at index time. Layer 7 gets a larger value because
# SaaS audit APIs deliver far later than network telemetry.
#
# KV_MODE = json extracts at search time, which keeps the index small but means
# raw tstats cannot see the fields; acceleration goes through data models
# instead. The alternative (INDEXED_EXTRACTIONS = json, KV_MODE = none) trades
# index size for direct tstats. Pick one estate-wide and record which.

[morpheus:score:l1]
KV_MODE            = json
SHOULD_LINEMERGE   = false
TRUNCATE           = 0
TIME_PREFIX        = "event_time"\s*:\s*"
TIME_FORMAT        = %Y-%m-%dT%H:%M:%S.%6N%Z
MAX_TIMESTAMP_LOOKAHEAD = 32
MAX_DAYS_AGO       = 30
category           = Custom

