#
# Deploy to search heads. Lookup definitions over the KV Store collections.
#
# Usage, walking an IP to a physical port (fields are space-separated, not
# comma-separated):
#
#   index=behavior_events sourcetype=morpheus:score:l3 max_abs_z>=6.0
#   | eval bucket=floor(_time/300), l1_bucket=floor(_time/86400)
#   | lookup binding_l2_l3 ip AS src_ip bucket OUTPUT mac port_id switch_id
#   | lookup binding_l1_history port_id switch_id bucket AS l1_bucket OUTPUT site_id transceiver_serial lldp_neighbor_chassis_id
#   | lookup binding_l1 port_id switch_id OUTPUT site_id AS site_now transceiver_serial AS transceiver_now lldp_neighbor_chassis_id AS neighbor_now
#   | eval site_id = coalesce(site_id, site_now), transceiver_serial = coalesce(transceiver_serial, transceiver_now), lldp_neighbor_chassis_id = coalesce(lldp_neighbor_chassis_id, neighbor_now)
#
# The last layer 1 hop is two lookups and a coalesce rather than one lookup,
# and the order is load-bearing. `binding_l1` answers what is in a port now;
# `binding_l1_history` answers what was in it during a given day, and holds a
# row only for a port whose optic has been replaced. Consulting the history
# first and falling back gives the interval that covers the event, so an
# investigation into last Tuesday resolves to last Tuesday's optic. Reversing
# the two, or dropping the history hop, silently answers every historical
# question in the present tense.

# `_key` is first in both fields_list on purpose. A KV Store lookup can only
# address a specific record when `_key` is among its fields, and without it the
# refresh jobs' `key_field=_key` has nothing to match on: every overlapping
# refresh window appends duplicate rows instead of overwriting the same
# document, and the expiry job cannot rewrite the rows it keeps. Determinism
# control 11 asks for idempotent sinks, and this one line is what makes the
# lookup writes idempotent rather than accumulating.
[binding_l2_l3]
external_type = kvstore
collection    = binding_l2_l3_collection
fields_list   = _key, ip, bucket, mac, port_id, switch_id, binding_uid

[binding_l2]
external_type = kvstore
collection    = binding_l2_collection
fields_list   = _key, mac, bucket, port_key, binding_uid

[binding_l5_l2]
external_type = kvstore
collection    = binding_l5_l2_collection
fields_list   = _key, dot1x_identity, bucket, port_key, binding_uid

# The estate's directory: which 802.1X identity each principal presents, and
# from when to when. It is the first rung of the walk from a person to a port,
# and it is the estate's to supply, the way port_designations is: no telemetry
# this app reads says who a supplicant is. The pipeline resolves sign-ins
# through the same export with BindingResolverStage and writes the answer on
# the event as desk_identity, so the identity walk reads it from there; this
# file is for walking a principal the pipeline did not see sign in. The shipped
# file is header-only, and valid_from and valid_until are epoch seconds, because
# a directory entry is a statement about an interval.
[principal_directory]
filename = principal_directory.csv

[binding_l1]
external_type = kvstore
collection    = binding_l1_collection
fields_list   = _key, port_id, switch_id, site_id, transceiver_serial, lldp_neighbor_chassis_id, binding_uid

[binding_l1_history]
external_type = kvstore
collection    = binding_l1_history_collection
fields_list   = _key, port_id, switch_id, bucket, site_id, transceiver_serial, lldp_neighbor_chassis_id, binding_uid

# Port designations, the list R-D-L2-001 is unusable without. One row per port
# as layer 1 and 2 spell it (site_id:switch_id:port_id), a designation, and the
# number of MAC addresses that port may legitimately carry (1 for a plain access
# port; 2 for a port with an IP phone in front of the workstation). Two more
# designations are read: "trunk" and "lag-member", which R-B-L2-002 excludes,
# because such a port carries whatever the switch on its far end carries and a
# step in its count is that switch's change rather than a device behind it. The shipped
# file is header-only on purpose: a designation list is a fact about one
# estate, and shipping a guessed one would make the rule fire on guesses.
# Populate it from the network inventory, and until it is populated the rule
# fires on nothing.
[port_designations]
filename = port_designations.csv

# The estate's VLANs and what each is for: which carries desks, which cameras,
# which the network's own management plane. R-C-003 labels the management
# destination its chain reached with the VLAN its subnet belongs to; the
# pipeline's TC3ReachStage reads the management subnets from the same record
# as management_prefixes, so the two agree on what management is. Matched on
# the destination address by CIDR. Header-only, as port_designations is: which
# subnet is an estate's management network is that estate's fact, and a
# guessed one would label flows that are not.
[vlan_designations]
filename = vlan_designations.csv
match_type = CIDR(subnet)

# The estate's own scanners, which R-B-L3-001 is unusable without and which
# this file cannot supply: which hosts are allowed to enumerate a network is a
# fact about one estate's vulnerability management, and shipping a guess would
# either silence a real scan or alarm on an authorized one. Header-only for the
# same reason port_designations is, and failing in the noisy direction rather
# than the silent one: until it is populated the rule fires on every scanner,
# including the ones somebody is paying for.
[scanner_allowlist]
filename = scanner_allowlist.csv

# The predictive watchlist: principals R-P-L5-006 and R-P-L7-006 have flagged,
# which R-B-L7-002 reads to report their exports more loudly. `_key` leads the
# fields for the same reason it does on the binding lookups: the writers'
# key_field=_key overwrites rather than appends, and the expiry job rewrites
# only the rows it keeps.
[principal_watchlist]
external_type = kvstore
collection    = principal_watchlist_collection
fields_list   = _key, user_principal, rule_id, reason, added, expires

# One row per detection: the saved search, the fields its notables are
# suppressed on and for how long, and its hysteresis, which no rule has yet.
# savedsearches.conf states the same alert.suppress.* keys and a test holds the
# two together, so the table is what a reviewer reads and what a later
# config_hash can take its thresholds from.
[rule_metadata]
filename = rule_metadata.csv

# The estate's cabling, which the Topology - LLDP adjacency search keeps: one
# row per link, keyed on link_key, so `_key` leads for the reason it does on the
# binding lookups.
[lldp_adjacency]
external_type = kvstore
collection    = lldp_adjacency_collection
fields_list   = _key, link_key, entity_key, site_id, device_id, port_id, lldp_neighbor_chassis_id, lldp_neighbor_port_id, first_seen, last_seen
