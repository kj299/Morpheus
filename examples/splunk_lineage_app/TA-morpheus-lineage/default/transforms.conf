#
# Deploy to search heads. Lookup definitions over the KV Store collections.
#
# Usage, walking an IP to a physical port (fields are space-separated, not
# comma-separated):
#
#   index=behavior_events sourcetype=morpheus:score:l3 max_abs_z>=6.0
#   | eval bucket=floor(_time/300), l1_bucket=floor(_time/86400)
#   | lookup binding_l2_l3 ip AS src_ip bucket OUTPUT mac port_id switch_id
#   | lookup binding_l1_history port_id switch_id bucket AS l1_bucket OUTPUT site_id transceiver_serial lldp_neighbor_chassis_id
#   | lookup binding_l1 port_id switch_id OUTPUT site_id AS site_now transceiver_serial AS transceiver_now lldp_neighbor_chassis_id AS neighbor_now
#   | eval site_id = coalesce(site_id, site_now), transceiver_serial = coalesce(transceiver_serial, transceiver_now), lldp_neighbor_chassis_id = coalesce(lldp_neighbor_chassis_id, neighbor_now)
#
# The last layer 1 hop is two lookups and a coalesce rather than one lookup,
# and the order is load-bearing. `binding_l1` answers what is in a port now;
# `binding_l1_history` answers what was in it during a given day, and holds a
# row only for a port whose optic has been replaced. Consulting the history
# first and falling back gives the interval that covers the event, so an
# investigation into last Tuesday resolves to last Tuesday's optic. Reversing
# the two, or dropping the history hop, silently answers every historical
# question in the present tense.

# `_key` is first in both fields_list on purpose. A KV Store lookup can only
# address a specific record when `_key` is among its fields, and without it the
# refresh jobs' `key_field=_key` has nothing to match on: every overlapping
# refresh window appends duplicate rows instead of overwriting the same
# document, and the expiry job cannot rewrite the rows it keeps. Determinism
# control 11 asks for idempotent sinks, and this one line is what makes the
# lookup writes idempotent rather than accumulating.
[binding_l2_l3]
external_type = kvstore
collection    = binding_l2_l3_collection
fields_list   = _key, ip, bucket, mac, port_id, switch_id, binding_uid

[binding_l1]
external_type = kvstore
collection    = binding_l1_collection
fields_list   = _key, port_id, switch_id, site_id, transceiver_serial, lldp_neighbor_chassis_id, binding_uid

[binding_l1_history]
external_type = kvstore
collection    = binding_l1_history_collection
fields_list   = _key, port_id, switch_id, bucket, site_id, transceiver_serial, lldp_neighbor_chassis_id, binding_uid

# Port designations, the list R-D-L2-001 is unusable without. One row per port
# as layer 1 and 2 spell it (site_id:switch_id:port_id), a designation, and the
# number of MAC addresses that port may legitimately carry (1 for a plain access
# port; 2 for a port with an IP phone in front of the workstation). The shipped
# file is header-only on purpose: a designation list is a fact about one
# estate, and shipping a guessed one would make the rule fire on guesses.
# Populate it from the network inventory, and until it is populated the rule
# fires on nothing.
[port_designations]
filename = port_designations.csv
