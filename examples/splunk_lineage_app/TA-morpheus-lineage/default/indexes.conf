#
# Deploy to indexers (or the cluster manager's app bundle). Volumes and size caps
# are sized for a mid-size deployment; adjust maxTotalDataSizeMB to the estate.
#
# Retention is deliberately asymmetric and the asymmetry is load-bearing:
#
#   - behavior_bindings and behavior_context are retained for 400 days while
#     behavior_events is retained for 90. Bindings are the only thing that makes a
#     historical attribution reconstructible; an incident investigated in month
#     eleven needs to know which host held an address in month one. Bindings are
#     also orders of magnitude smaller than events, so this is close to free.
#   - behavior_lineage (edges) is retained for 30 days, shorter than events. An
#     edge is derivable from the events it links, so an old chain can be rebuilt
#     if it ever matters.
#
# If you change the binding retention, change the expiry saved search in
# savedsearches.conf to match. A lookup that expires before its index produces
# unattributable events.
#
# What each index holds about a person, which is the other half of a retention
# decision and was missing from this file until now. The categories are the
# ones in morpheus.utils.personal_data, and that module is the inventory:
#
#   - behavior_events carries all five personal categories, and the one it
#     carries most of is the behavioural profile the pipeline derives rather
#     than collects: when a principal usually works, where they usually are,
#     which devices and applications are theirs, and how far today sits from
#     their own past. Ninety days of it.
#   - behavior_bindings carries addresses and locations, and is retained for
#     400 days because a historical attribution is what it exists for. It is
#     also, for the same reason, the index that re-identifies the others.
#   - behavior_lineage carries pseudonyms only -- the edges name event
#     identifiers, not people -- but an edge is a route to the events it links.
#   - behavior_summary carries per-layer scores by entity_key, so it holds
#     whichever subject that layer names: a port, a MAC, or a principal.
#   - behavior_context is the identity and asset data the joins need. This app
#     ships no producer for it; whoever populates it decides its retention, and
#     400 days here is a default rather than a recommendation.
#
# Retention is the only control in this file. Minimization happens upstream,
# with morpheus.stages.lineage.minimization_stage.MinimizationStage before the
# sink, and it is not a substitute: what reaches an index at all is a pipeline
# decision, and how long it stays is this one.
#
# Size caps (maxTotalDataSizeMB) are deliberately absent: the property is
# prohibited in Splunk Cloud, and on-premises the right cap is estate-specific.
# On-premises deployments should add caps sized to their own volume; as a
# starting point the design assumed roughly 2 TB for behavior_events and
# 500 GB for behavior_lineage.

[behavior_events]
homePath   = $SPLUNK_DB/behavior_events/db
coldPath   = $SPLUNK_DB/behavior_events/colddb
thawedPath = $SPLUNK_DB/behavior_events/thaweddb
frozenTimePeriodInSecs = 7776000

[behavior_lineage]
homePath   = $SPLUNK_DB/behavior_lineage/db
coldPath   = $SPLUNK_DB/behavior_lineage/colddb
thawedPath = $SPLUNK_DB/behavior_lineage/thaweddb
frozenTimePeriodInSecs = 2592000

[behavior_bindings]
homePath   = $SPLUNK_DB/behavior_bindings/db
coldPath   = $SPLUNK_DB/behavior_bindings/colddb
thawedPath = $SPLUNK_DB/behavior_bindings/thaweddb
frozenTimePeriodInSecs = 34560000

[behavior_context]
homePath   = $SPLUNK_DB/behavior_context/db
coldPath   = $SPLUNK_DB/behavior_context/colddb
thawedPath = $SPLUNK_DB/behavior_context/thaweddb
frozenTimePeriodInSecs = 34560000

# 5-minute per-layer score rollups written by the "Behavior summary" saved
# search. Chained rules run against this index so their cost is independent of
# raw event volume. Retention matches behavior_events, since a chained rule can
# look back as far as any event it correlates.
[behavior_summary]
homePath   = $SPLUNK_DB/behavior_summary/db
coldPath   = $SPLUNK_DB/behavior_summary/colddb
thawedPath = $SPLUNK_DB/behavior_summary/thaweddb
frozenTimePeriodInSecs = 7776000
