#
# Deploy to search heads. Three groups of searches: lookup maintenance, summary
# population, and detections.
#
# Shared scheduling discipline, from Part 5 of the design guide:
#
#   - dispatch.latest_time is never "now". Every window trails by at least the
#     lateness horizon, so two runs over the same nominal window return the same
#     rows and every search is reproducible.
#   - The @m snap matters as much as the offset; without it the window boundary
#     moves with scheduler jitter.
#   - realtime_schedule = 0 puts every search on continuous scheduling, so a run
#     skipped during a restart is caught up rather than abandoned. A skipped
#     lookup refresh would otherwise leave a permanent hole in the bindings.

# --- Lookup maintenance ---------------------------------------------------

# Materialize bucketed L2/L3 binding rows into the KV Store. The _key is a
# deterministic composite of the lookup's own key fields, which makes the write
# idempotent: a re-run, a replay, or the overlapping window overwrites the same
# document instead of appending a duplicate. The window trails by five minutes
# to absorb indexing latency, and is twice the schedule interval so a single
# late-arriving binding still lands; the idempotent _key makes the overlap
# harmless.
[Binding lookup - L2/L3 refresh]
enableSched            = 1
cron_schedule          = */5 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time   = -5m@m
realtime_schedule      = 0
schedule_window        = 2
search = index=behavior_bindings sourcetype=binding:bucketed binding_table=dhcp_lease \
| eval _key = ip . "|" . bucket \
| table _key ip bucket mac port_id switch_id binding_uid \
| outputlookup binding_l2_l3 append=t key_field=_key

# L1 bindings churn on the scale of months, so an hourly refresh is generous.
# Unbucketed: the key is the port itself.
[Binding lookup - L1 refresh]
enableSched            = 1
cron_schedule          = 7 * * * *
dispatch.earliest_time = -2h@m
dispatch.latest_time   = -5m@m
realtime_schedule      = 0
schedule_window        = 5
search = index=behavior_bindings sourcetype=binding:l1 \
| eval _key = port_id . "|" . switch_id \
| table _key port_id switch_id site_id transceiver_serial lldp_neighbor_chassis_id binding_uid \
| outputlookup binding_l1 append=t key_field=_key

# outputlookup append=t never removes anything, so expiry is a separate job.
# The retention here (34560000 seconds, 400 days) must match
# frozenTimePeriodInSecs on behavior_bindings in indexes.conf; the bucket width
# (300 seconds) must match the pipeline's bucket_seconds. This is the one place
# now() is acceptable: the job is maintenance, not detection, and its output is
# never compared across runs. It is scheduled at 03:17 so it does not collide
# with a refresh mid-write.
[Binding lookup - L2/L3 expiry]
enableSched            = 1
cron_schedule          = 17 3 * * *
realtime_schedule      = 0
schedule_window        = 30
search = | inputlookup binding_l2_l3 \
| where bucket >= floor((now() - 34560000) / 300) \
| outputlookup binding_l2_l3

# --- Summary population ----------------------------------------------------

# Roll per-layer scores into 5-minute rows. Chained rules run against
# behavior_summary, which makes their runtime independent of raw event volume
# and their results independent of index-time variability. The window width
# equals the cadence, so consecutive runs cover disjoint slices and nothing is
# double-counted; the 15-minute trailing edge is the lateness horizon.
#
# collect deliberately omits a sourcetype: the default (stash) is what keeps
# summary indexing exempt from license metering. Setting a custom sourcetype
# here would silently bill the summary volume against the license. Consumers
# filter on the index alone.
[Behavior summary - per-layer scores]
enableSched            = 1
cron_schedule          = */5 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time   = -15m@m
realtime_schedule      = 0
schedule_window        = 2
search = index=behavior_events sourcetype=morpheus:score:l* \
| bin _time span=5m \
| stats max(max_abs_z)   AS peak_z \
        sum(risk_score)  AS total_risk \
        values(rule_id)  AS rules \
        dc(event_uid)    AS event_count \
  by _time osi_layer entity_key lineage_id \
| collect index=behavior_summary

# --- Detections -------------------------------------------------------------

# Cross-layer chain assembly over the union of edges and scored events, keyed
# on lineage_id. join and transaction are both deliberately absent: join's
# subsearch silently truncates at 50,000 rows and transaction's results depend
# on arrival order. The layer_span filter keeps this cheap, since the
# overwhelming majority of chains are single-layer and are discarded before
# anything expensive happens. The window is 30 minutes wide, trailing by the
# 15-minute lateness horizon; chains can match on consecutive runs, so
# consumers deduplicate on (rule_id, lineage_id), which is stable across runs
# by construction.
[Chain assembly - cross-layer risk]
enableSched            = 1
cron_schedule          = */15 * * * *
dispatch.earliest_time = -45m@m
dispatch.latest_time   = -15m@m
realtime_schedule      = 0
schedule_window        = 5
allow_skew             = 5m
description = Assemble multi-layer lineage chains and score them. Determinism tier D2. Emits one row per chain spanning three or more OSI layers.
search = (index=behavior_lineage sourcetype=morpheus:edge) OR (index=behavior_events) \
| stats dc(osi_layer)   AS layer_span \
        min(_time)      AS chain_start \
        max(_time)      AS chain_end \
        max(max_abs_z)  AS peak_z \
        sum(risk_score) AS total_risk \
        values(rule_id) AS rules \
        values(join_method) AS methods \
  by lineage_id \
| where layer_span >= 3 \
| where total_risk >= 60 OR (layer_span >= 4 AND peak_z >= 4.0) \
| eval chain_duration = chain_end - chain_start \
| sort - total_risk
action.correlationsearch.enabled = 1
action.correlationsearch.label   = Cross-layer chain risk

# Ordered sequence: a layer 6 TLS fingerprint anomaly followed within one hour
# by layer 3 beaconing on the same endpoint pair. gap > 0 enforces the
# ordering, which is the entire point of a chained rule; a rule that matches in
# either order is a co-occurrence rule and should be labeled as one. The
# 2-hour window covers the 1-hour span plus the schedule interval plus the
# lateness horizon, so a sequence straddling a window boundary is still seen.
[R-C-002 - TLS anomaly precedes beaconing]
enableSched            = 1
cron_schedule          = */15 * * * *
dispatch.earliest_time = -2h@m
dispatch.latest_time   = -15m@m
realtime_schedule      = 0
schedule_window        = 5
allow_skew             = 5m
description = Layer 6 TLS fingerprint anomaly followed within one hour by layer 3 beaconing on the same endpoint pair. Determinism tier D2. Bucket width 300s on binding lookups.
search = index=behavior_events (rule_id="R-B-L6-001" OR rule_id="R-B-L3-002") \
| stats min(eval(if(rule_id="R-B-L6-001", _time, null()))) AS t_tls \
        min(eval(if(rule_id="R-B-L3-002", _time, null()))) AS t_beacon \
        values(lineage_id) AS lineage_id \
  by src_ip dest_ip \
| where isnotnull(t_tls) AND isnotnull(t_beacon) \
| eval gap = t_beacon - t_tls \
| where gap > 0 AND gap <= 3600 \
| eval rule_id = "R-C-002", risk_score = 70
action.correlationsearch.enabled = 1
action.correlationsearch.label   = R-C-002

# Health check on the soft-join substrate rather than a threat detection. A
# rising unresolved rate means the collector is losing expiry records and every
# attribution it produces is suspect. Fires when more than a fifth of layer 3
# rows in the window could not be resolved against a binding.
[Binding health - unresolved rate]
enableSched            = 1
cron_schedule          = 23 * * * *
dispatch.earliest_time = -75m@m
dispatch.latest_time   = -15m@m
realtime_schedule      = 0
schedule_window        = 10
description = Alert when the BindingResolverStage unresolved rate exceeds 20 percent, which means attributions are becoming guesses.
search = index=behavior_events sourcetype=morpheus:score:l3 \
| stats count AS total count(eval(resolution_method="unresolved")) AS unresolved \
| eval unresolved_rate = round(unresolved / total, 3) \
| where total > 0 AND unresolved_rate > 0.2
