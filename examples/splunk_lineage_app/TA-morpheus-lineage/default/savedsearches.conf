#
# Deploy to search heads. Three groups of searches: lookup maintenance, summary
# population, and detections.
#
# Shared scheduling discipline, from Part 5 of the design guide:
#
#   - dispatch.latest_time is never "now". Every window trails by at least the
#     lateness horizon, so two runs over the same nominal window return the same
#     rows and every search is reproducible.
#   - The @m snap matters as much as the offset; without it the window boundary
#     moves with scheduler jitter.
#   - realtime_schedule = 0 puts every search on continuous scheduling, so a run
#     skipped during a restart is caught up rather than abandoned. A skipped
#     lookup refresh would otherwise leave a permanent hole in the bindings.

# --- Lookup maintenance ---------------------------------------------------

# Materialize bucketed L2/L3 binding rows into the KV Store. The _key is a
# deterministic composite of the lookup's own key fields, which makes the write
# idempotent: a re-run, a replay, or the overlapping window overwrites the same
# document instead of appending a duplicate. The window trails by five minutes
# to absorb indexing latency, and is three times the schedule interval so a
# single late-arriving binding still lands; the idempotent _key makes the
# overlap harmless.
#
# `binding_table` is a shared contract, not a field Splunk derives: several
# binding sources land on this one sourcetype and the refresh has to tell them
# apart. The producer sets it with
# `BindingTable.to_bucketed_records(table_name="dhcp_lease")`. Without it this
# search matches nothing and the lookup stays empty, which is the same posture
# as the other estate-supplied lists this app ships.
[Binding lookup - L2/L3 refresh]
enableSched            = 1
cron_schedule          = */5 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time   = -5m@m
realtime_schedule      = 0
schedule_window        = 2
search = index=behavior_bindings sourcetype=binding:bucketed binding_table=dhcp_lease \
| eval _key = ip . "|" . bucket \
| table _key ip bucket mac port_id switch_id binding_uid \
| outputlookup binding_l2_l3 append=t key_field=_key

# L1 bindings churn on the scale of months, so an hourly refresh is generous.
# Unbucketed: the key is the port itself, and the row this leaves behind is the
# port's latest interval -- what is in it now.
#
# The sort is not cosmetic. `outputlookup append=t key_field=_key` overwrites a
# document every time it writes one, so where a port has more than one interval
# the row that survives is whichever this search emitted last. Event results
# arrive newest first, which would leave the *oldest* optic in a lookup whose
# whole claim is to hold the newest. Sorting ascending makes last-written mean
# latest-started, which is the tie-break `BindingTable` resolves with and the
# one `BindingTable.superseded` assumes when it decides which interval the
# history collection below does not have to carry. `bind_start` sorts as a
# string, and that is chronological only because `render_event_time` produces a
# fixed-width zero-padded RFC 3339 stamp; a producer that trimmed the subsecond
# digits would break the order without breaking the search.
[Binding lookup - L1 refresh]
enableSched            = 1
cron_schedule          = 7 * * * *
dispatch.earliest_time = -2h@m
dispatch.latest_time   = -5m@m
realtime_schedule      = 0
schedule_window        = 5
search = index=behavior_bindings sourcetype=binding:l1 \
| sort 0 bind_start bind_end binding_uid \
| eval _key = port_id . "|" . switch_id \
| table _key port_id switch_id site_id transceiver_serial lldp_neighbor_chassis_id binding_uid \
| outputlookup binding_l1 append=t key_field=_key

# The history beside it. A current-state lookup answers a question about last
# Tuesday with the optic installed on Wednesday, silently and with no sign that
# the answer is from the wrong interval, and that is the wrong tense for the
# question the identifier ladder asks. These rows are the intervals the refresh
# above has overwritten, expanded across day-wide buckets by
# `BindingTable.superseded().to_bucketed_frame(bucket_seconds=86400)` and sent
# on the shared bucketed sourcetype with binding_table=port_inventory.
#
# A port whose optic never changed produces no row here at all, so the
# collection is proportional to the estate's churn rather than to its size.
# That is what makes bucketing layer 1 affordable where bucketing every port
# across every day of the retention period would not be.
[Binding lookup - L1 history refresh]
enableSched            = 1
cron_schedule          = 37 * * * *
dispatch.earliest_time = -2h@m
dispatch.latest_time   = -5m@m
realtime_schedule      = 0
schedule_window        = 5
search = index=behavior_bindings sourcetype=binding:bucketed binding_table=port_inventory \
| eval _key = port_id . "|" . switch_id . "|" . bucket \
| table _key port_id switch_id bucket site_id transceiver_serial lldp_neighbor_chassis_id binding_uid \
| outputlookup binding_l1_history append=t key_field=_key

# outputlookup append=t never removes anything, so expiry is a separate job.
# `inputlookup` surfaces `_key` only because it is in the lookup's fields_list
# (see transforms.conf), and passing it back through `key_field` is what makes
# this a rewrite of the surviving rows rather than a fresh set of documents
# with new keys, which would leave the refresh job writing duplicates forever.
# The retention here (34560000 seconds, 400 days) must match
# frozenTimePeriodInSecs on behavior_bindings in indexes.conf; the bucket width
# (300 seconds) must match the pipeline's bucket_seconds. This is the one place
# now() is acceptable: the job is maintenance, not detection, and its output is
# never compared across runs. It is scheduled at 03:17 so it does not collide
# with a refresh mid-write.
[Binding lookup - L2/L3 expiry]
enableSched            = 1
cron_schedule          = 17 3 * * *
realtime_schedule      = 0
schedule_window        = 30
search = | inputlookup binding_l2_l3 \
| where bucket >= floor((now() - 34560000) / 300) \
| outputlookup binding_l2_l3 key_field=_key

# The same job for the layer 1 history, on the same retention and its own
# bucket width. The current-state collection needs no expiry: it holds one row
# per port and a decommissioned port's row is the last true thing known about
# it, so there is nothing that grows and nothing to trim.
[Binding lookup - L1 history expiry]
enableSched            = 1
cron_schedule          = 47 3 * * *
realtime_schedule      = 0
schedule_window        = 30
search = | inputlookup binding_l1_history \
| where bucket >= floor((now() - 34560000) / 86400) \
| outputlookup binding_l1_history key_field=_key

# --- Summary population ----------------------------------------------------

# `peak_destinations` is here for R-P-L3-005, which reads the shape of a
# source's fan-out across windows rather than its level. It is null for every
# layer but 3, which is what `max()` of an absent field gives and is the
# correct answer: no other layer counts destinations. Carrying it in the
# summary rather than recomputing it is the whole reason the trajectory rule is
# affordable, since at layer 3 the raw index is flow records.
#
# Roll per-layer scores into 5-minute rows. Chained rules run against
# behavior_summary, which makes their runtime independent of raw event volume
# and their results independent of index-time variability. The window width
# equals the cadence, so consecutive runs cover disjoint slices and nothing is
# double-counted; the 15-minute trailing edge is the lateness horizon.
#
# collect deliberately omits a sourcetype: the default (stash) is what keeps
# summary indexing exempt from license metering. Setting a custom sourcetype
# here would silently bill the summary volume against the license. Consumers
# filter on the index alone.
[Behavior summary - per-layer scores]
enableSched            = 1
cron_schedule          = */5 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time   = -15m@m
realtime_schedule      = 0
schedule_window        = 2
search = index=behavior_events sourcetype=morpheus:score:l* \
| bin _time span=5m \
| stats max(max_abs_z)     AS peak_z \
        sum(risk_score)    AS total_risk \
        max(dsts_per_src)  AS peak_destinations \
        values(rule_id)    AS rules \
        dc(event_uid)      AS event_count \
  by _time osi_layer entity_key lineage_id \
| collect index=behavior_summary

# --- Detections -------------------------------------------------------------

# Cross-layer chain assembly over the union of edges and scored events, keyed
# on lineage_id. join and transaction are both deliberately absent: join's
# subsearch silently truncates at 50,000 rows and transaction's results depend
# on arrival order. The layer_span filter keeps this cheap, since the
# overwhelming majority of chains are single-layer and are discarded before
# anything expensive happens. The window is 30 minutes wide, trailing by the
# 15-minute lateness horizon; chains can match on consecutive runs, so
# consumers deduplicate on (rule_id, lineage_id), which is stable across runs
# by construction.
[Chain assembly - cross-layer risk]
enableSched            = 1
cron_schedule          = */15 * * * *
dispatch.earliest_time = -45m@m
dispatch.latest_time   = -15m@m
realtime_schedule      = 0
schedule_window        = 5
allow_skew             = 5m
description = Assemble multi-layer lineage chains and score them. Determinism tier D2. Emits one row per chain spanning three or more OSI layers.
search = (index=behavior_lineage sourcetype=morpheus:edge) OR (index=behavior_events) \
| stats dc(osi_layer)   AS layer_span \
        min(_time)      AS chain_start \
        max(_time)      AS chain_end \
        max(max_abs_z)  AS peak_z \
        sum(risk_score) AS total_risk \
        values(rule_id) AS rules \
        values(join_method) AS methods \
  by lineage_id \
| where layer_span >= 3 \
| where total_risk >= 60 OR (layer_span >= 4 AND peak_z >= 4.0) \
| eval chain_duration = chain_end - chain_start \
| sort - total_risk
action.correlationsearch.enabled = 1
action.correlationsearch.label   = Cross-layer chain risk

# Ordered sequence: a layer 6 TLS fingerprint anomaly followed within one hour
# by layer 3 beaconing on the same endpoint pair. gap > 0 enforces the
# ordering, which is the entire point of a chained rule; a rule that matches in
# either order is a co-occurrence rule and should be labeled as one. The
# 2-hour window covers the 1-hour span plus the schedule interval plus the
# lateness horizon, so a sequence straddling a window boundary is still seen.
#
# The pair is (src_ip, dst_ip). It was (src_ip, dest_ip) until layer 6 landed
# and gave this search its first chance to return a row, at which point the
# spelling mattered: dest_ip is the Splunk CIM name and upstream Morpheus's
# default, and every stage in this fork emits dst_ip. Both detections this
# search reads emit dst_ip, so grouping by dest_ip put a null in one of the two
# group keys on every notable -- which does not fail, it collapses every
# fingerprint and every beacon in the window into a single group and reports
# any of them against any other. A rule that cannot fire is visible; a rule
# that fires on the wrong pairs is not. test_splunk_field_contracts.py did not
# catch it because dest_ip is produced -- by the lineage pipeline, which is not
# the pipeline whose notables this search reads.
[R-C-002 - TLS anomaly precedes beaconing]
enableSched            = 1
cron_schedule          = */15 * * * *
dispatch.earliest_time = -2h@m
dispatch.latest_time   = -15m@m
realtime_schedule      = 0
schedule_window        = 5
allow_skew             = 5m
description = Layer 6 TLS fingerprint anomaly followed within one hour by layer 3 beaconing on the same endpoint pair. Determinism tier D2. Bucket width 300s on binding lookups.
search = index=behavior_events (rule_id="R-B-L6-001" OR rule_id="R-B-L3-002") \
| stats min(eval(if(rule_id="R-B-L6-001", _time, null()))) AS t_tls \
        min(eval(if(rule_id="R-B-L3-002", _time, null()))) AS t_beacon \
        values(lineage_id) AS lineage_id \
  by src_ip dst_ip \
| where isnotnull(t_tls) AND isnotnull(t_beacon) \
| eval gap = t_beacon - t_tls \
| where gap > 0 AND gap <= 3600 \
| eval rule_id = "R-C-002", risk_score = 70
action.correlationsearch.enabled = 1
action.correlationsearch.label   = R-C-002

# The first two detections that read shipped columns directly and need no
# external list. Both are deterministic rules (R-D): a pure function of the
# rows in the window, tier D1. Both use the summary search's window shape,
# five minutes wide trailing the fifteen-minute lateness horizon, so
# consecutive runs cover disjoint slices and a detection is emitted once.
#
# One MAC reported on two ports too close together for the device to have
# moved between them. TC2BindingStage closes the earlier binding and records
# bind_gap_ns: how long the MAC was absent from the first port before it
# turned up on the second.
#
# The gap is the whole rule. bind_end_reason=conflict is emitted only when the
# two sightings carry the identical nanosecond, which no estate polling its
# switches sequentially will ever produce, so a rule filtering on conflict
# alone fires on a real network approximately never. bind_end_reason=displaced
# with a small gap is the same event as the poller actually reports it. A
# device that roams is absent from the first switch for however long the move
# took; a MAC claimed in two places at once is not absent at all.
#
# gap_threshold is a placeholder. Tune it to the time one sweep of the estate's
# switches takes, not to the poll cadence: two switches reporting the same MAC
# inside a single sweep cannot both be right, while the same two sightings a
# cadence apart are an ordinary move. Too high and every roaming laptop is a
# notable; too low and a spoof on a slow poller is missed.
#
# Reads the raw closed binding records (sourcetype binding:l2, timed on
# bind_end), not the bucketed lookup rows, which carry no end reason.
# Deduplicate on (rule_id, mac_address, bind_start).
[R-D-L2-004 - MAC in two places at once]
enableSched            = 1
cron_schedule          = */5 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time   = -15m@m
realtime_schedule      = 0
schedule_window        = 2
description = A MAC address was observed on two ports closer together in time than the device could have moved between them. Determinism tier D1. Reads bind_end_reason and bind_gap_ns from TC2BindingStage output. gap_threshold is a placeholder to tune against the estate's own poll sweep.
search = index=behavior_bindings sourcetype=binding:l2 (bind_end_reason=conflict OR bind_end_reason=displaced) \
| eval gap_threshold = 60000000000 \
| where bind_gap_ns <= gap_threshold \
| eval rule_id = "R-D-L2-004", risk_score = 60, osi_layer = 2, entity_key = mac_address, gap_seconds = bind_gap_ns / 1000000000 \
| table _time rule_id risk_score osi_layer entity_key mac_address gap_seconds bind_end_reason port_key site_id switch_id port_id vlan_id bind_start bind_end bind_observations
action.correlationsearch.enabled = 1
action.correlationsearch.label   = R-D-L2-004

# An 802.1X outcome that arrived with no exchange in front of it on that port.
# TC2AuthStage marks the row auth_unpaired=true. From the switch this is what
# MAC authentication bypass, or a device bridged behind an already authorized
# supplicant, looks like. On ports where MAB is configured deliberately,
# suppress by port designation rather than by loosening the rule. Deduplicate
# on (rule_id, event_uid). The supplicant fields are on the table clause because
# a shared port carries several devices and the alert has to say which one.
[R-D-L2-005 - Authorization without authentication]
enableSched            = 1
cron_schedule          = */5 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time   = -15m@m
realtime_schedule      = 0
schedule_window        = 2
description = An 802.1X authorization was reported on a port with no authentication exchange preceding it. Determinism tier D1. Reads auth_unpaired=true from TC2AuthStage output.
search = index=behavior_events sourcetype=morpheus:score:l2 auth_unpaired=true \
| eval rule_id = "R-D-L2-005", risk_score = 50, osi_layer = 2, entity_key = auth_port_key \
| table _time rule_id risk_score osi_layer entity_key auth_port_key site_id switch_id port_id mac_address dot1x_identity dot1x_result event_uid lineage_id
action.correlationsearch.enabled = 1
action.correlationsearch.label   = R-D-L2-005

# --- Layer 3 detections ----------------------------------------------------
#
# Five rules over morpheus:score:l3, which TC3CardinalityStage, TC3ReachStage,
# TC3BeaconStage and TC3TtlStage produce between them. Two thresholds here are
# the guide's own numbers (0.15 for the beacon coefficient, one hop for the TTL
# shift) and one is not: "predominantly internal" has no figure in the guide, so
# this app fixes it at a simple majority and says so, because a threshold that
# lives only in prose is a threshold two deployments implement differently.
#
# Sampling is the condition none of these searches can see. A 1:1000 flow feed
# turns the fan-out count into a sample statistic with enormous variance at the
# low true counts that matter, and nothing on the record says whether sampling
# happened. An estate that cannot collect unsampled at the aggregation layer
# should disable R-B-L3-001 and R-P-L3-005 rather than tune them, and read the
# ratio rules instead: a proportion survives sampling and a distinct count does
# not.

# One host reaching many addresses inside the estate. All three of the guide's
# conditions are required and each does different work: the count alone is
# volume nobody can triage, the internal proportion is what separates a scan
# from a browser reaching just as many places on the internet, and the
# allowlist is what keeps the estate's own scanners out of it. The allowlist is
# a lookup this app ships header-only, exactly as the port designations are: an
# unpopulated list means the rule fires on every scanner including the
# authorized ones, which is the noisy direction rather than the silent one, and
# is stated here rather than discovered.
[R-B-L3-001 - Fan-out expansion]
enableSched            = 1
cron_schedule          = */5 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time   = -15m@m
realtime_schedule      = 0
schedule_window        = 2
description = One source reaching an unusual number of distinct internal destinations within the window. Determinism tier D1. Reads dsts_per_src and internal_dst_ratio from the TC-3 stages, against the scanner_allowlist lookup.
search = index=behavior_events sourcetype=morpheus:score:l3 dsts_per_src>50 internal_dst_ratio>0.5 \
| lookup scanner_allowlist src_ip OUTPUT allowed \
| where isnull(allowed) OR allowed!="true" \
| stats max(dsts_per_src) AS distinct_destinations max(internal_dst_ratio) AS internal_ratio max(dsts_per_src_saturated) AS saturated values(event_uid) AS event_uids values(lineage_id) AS lineage_id earliest(_time) AS _time BY src_ip \
| eval rule_id = "R-B-L3-001", risk_score = 50, osi_layer = 3, entity_key = src_ip \
| table _time rule_id risk_score osi_layer entity_key src_ip distinct_destinations internal_ratio saturated event_uids lineage_id
action.correlationsearch.enabled = 1
action.correlationsearch.label   = R-B-L3-001

# A conversation on a timer. The coefficient of variation is scale-free, so one
# threshold covers a beacon every minute and one every hour, which a threshold
# on the deviation could not. Both halves of the guide's rule are required: the
# timing regularity and the narrow byte band. flow_regularity_mature is the
# twelve-interval floor the guide names, carried on the row so this search does
# not have to count arrivals itself -- and without it the rule would fire on any
# two evenly spaced flows.
#
# Grouped by flow_pair_key rather than by src_ip on purpose. A workstation that
# beacons to one address and browses to five hundred others has a perfectly
# regular conversation buried in a wholly irregular stream, and a search keyed
# on the host would average it away.
[R-B-L3-002 - Beaconing]
enableSched            = 1
cron_schedule          = */5 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time   = -15m@m
realtime_schedule      = 0
schedule_window        = 2
description = A directed address pair exchanging fixed-size messages at near-constant intervals. Determinism tier D1. Reads flow_interval_cv, flow_size_cv and flow_regularity_mature from TC3BeaconStage output.
search = index=behavior_events sourcetype=morpheus:score:l3 flow_regularity_mature=true flow_interval_cv<0.15 flow_size_cv<0.15 \
| stats min(flow_interval_cv) AS interval_cv min(flow_size_cv) AS size_cv max(flow_intervals) AS intervals max(flow_mean_interval_ns) AS mean_interval_ns values(src_ip) AS src_ip values(dst_ip) AS dst_ip values(event_uid) AS event_uids values(lineage_id) AS lineage_id earliest(_time) AS _time BY flow_pair_key \
| eval rule_id = "R-B-L3-002", risk_score = 60, osi_layer = 3, entity_key = src_ip, mean_interval_s = round(mean_interval_ns / 1000000000, 1) \
| table _time rule_id risk_score osi_layer entity_key flow_pair_key src_ip dst_ip interval_cv size_cv intervals mean_interval_s event_uids lineage_id
action.correlationsearch.enabled = 1
action.correlationsearch.label   = R-B-L3-002

# Traffic to a reserved or multicast destination. Low volume and high signal by
# nature, and the only layer 3 rule that is about a single flow rather than
# about a proportion: traffic to a range nobody routes is not a matter of
# degree. The classification is TC3ReachStage's, taken from parsers/ip.py, so
# this search holds no copy of the range list.
[R-D-L3-003 - Reserved-range egress]
enableSched            = 1
cron_schedule          = */5 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time   = -15m@m
realtime_schedule      = 0
schedule_window        = 2
description = A flow to a reserved or multicast destination address. Determinism tier D1. Reads dst_is_reserved and dst_is_multicast from TC3ReachStage output.
search = index=behavior_events sourcetype=morpheus:score:l3 (dst_is_reserved=true OR dst_is_multicast=true) \
| eval rule_id = "R-D-L3-003", risk_score = 30, osi_layer = 3, entity_key = src_ip, destination_class = if(dst_is_reserved="true", "reserved", "multicast") \
| table _time rule_id risk_score osi_layer entity_key src_ip dst_ip dst_port protocol destination_class bytes_out event_uid lineage_id
action.correlationsearch.enabled = 1
action.correlationsearch.label   = R-D-L3-003

# A source whose packets stop arriving with the hop count they used to. One hop
# is what an interposed device costs, which is why the stage's threshold is one
# and this search does not raise it -- the guide's wording says "more than one
# hop-equivalent", and read strictly that excludes the single forwarding device
# the rule exists for.
#
# Aggregated rather than per flow, because the guide's rule is about a
# distribution moving rather than about a packet. A single shifted flow is
# noise; several in a window with the same shift is a path that changed, and
# the count is on the notable so an analyst can tell which they are looking at.
[R-B-L3-004 - TTL fingerprint shift]
enableSched            = 1
cron_schedule          = */5 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time   = -15m@m
realtime_schedule      = 0
schedule_window        = 2
description = A source whose IP time-to-live has moved away from its own established value. Determinism tier D1. Reads ip_ttl_shift, ip_ttl_shifted and ip_ttl_established from TC3TtlStage output.
search = index=behavior_events sourcetype=morpheus:score:l3 ip_ttl_shifted=true ip_ttl_mature=true \
| stats count AS shifted_flows values(ip_ttl_shift) AS shifts max(ip_ttl_established) AS established_ttl max(ip_ttl_distinct) AS distinct_ttls values(event_uid) AS event_uids values(lineage_id) AS lineage_id earliest(_time) AS _time BY src_ip \
| where shifted_flows >= 3 \
| eval rule_id = "R-B-L3-004", risk_score = 45, osi_layer = 3, entity_key = src_ip \
| table _time rule_id risk_score osi_layer entity_key src_ip shifted_flows shifts established_ttl distinct_ttls event_uids lineage_id
action.correlationsearch.enabled = 1
action.correlationsearch.label   = R-B-L3-004

# The predictive one. It reads the shape of the fan-out rather than its level,
# so it fires during the expansion phase of a scan rather than at the peak, and
# it is a watchlist rule: it should never page. Three consecutive windows with
# the count rising each time, which is the second difference the guide asks for
# expressed as the thing a search can actually compute.
#
# Runs against behavior_summary rather than the raw index, so its cost is
# independent of flow volume -- which at layer 3 is the difference between a
# search that completes and one that does not.
[R-P-L3-005 - Fan-out trajectory]
enableSched            = 1
cron_schedule          = 20 * * * *
dispatch.earliest_time = -4h@h
dispatch.latest_time   = -15m@m
realtime_schedule      = 0
schedule_window        = 10
description = A source whose distinct-destination count has risen in each of three consecutive windows. Watchlist rather than alert. Determinism tier D1. Reads the per-window maximum of dsts_per_src from the behavior summary.
search = index=behavior_summary osi_layer=3 \
| sort 0 entity_key _time \
| streamstats current=f last(peak_destinations) AS previous_destinations last(previous_destinations) AS earlier_destinations BY entity_key \
| where isnotnull(earlier_destinations) AND peak_destinations > previous_destinations AND previous_destinations > earlier_destinations \
| eval rule_id = "R-P-L3-005", risk_score = 25, osi_layer = 3, rise = peak_destinations - earlier_destinations \
| table _time rule_id risk_score osi_layer entity_key earlier_destinations previous_destinations peak_destinations rise
action.correlationsearch.enabled = 1
action.correlationsearch.label   = R-P-L3-005

# A source sending SYNs that nothing answers, to more destination ports than
# anything with business there would touch. Both halves are required: the
# unanswered part is what separates a scan from a busy workstation, and the
# breadth is what separates it from a single failed connection.
#
# The per-flow figures are recovered by dividing the maxima of the counts, not
# by aggregating flow_syn_ratio. The counts are running totals and rise
# monotonically through a bin, so their maxima are the bin's totals; the ratio
# is running too, and a running ratio is not monotone. An ordinary handshake
# opens with a bare SYN, so max(flow_syn_ratio) over it is 1.0 -- the scan's
# figure exactly -- and a search that aggregated the ratio column would report
# every connection in the estate as a port scan. The ratio columns on the row
# are for the model, which reads one row at a time.
#
# A horizontal sweep does not fire this and should not: every one of its SYNs
# is unanswered and scores like the scanner's per flow, but it touches one port
# across many hosts rather than many ports on one. R-D-L4-003 is the rule for
# that shape. destination_hosts is carried so an analyst can see which they
# are looking at.
[R-D-L4-002 - SYN without completion]
enableSched            = 1
cron_schedule          = */5 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time   = -15m@m
realtime_schedule      = 0
schedule_window        = 2
description = One source opening connections that nothing answers, across more than fifty destination ports in a 60-second bin. Determinism tier D1. Reads the flag counts from TC4FlowStage output.
search = index=behavior_events sourcetype=morpheus:score:l4 \
| stats max(flow_syn) AS syn max(flow_ack) AS ack max(flow_all) AS flags values(event_uid) AS flow_event_uids values(lineage_id) AS flow_lineage_ids earliest(_time) AS _time BY flow_id rollup_time_ns src_ip dst_ip dst_port \
| where flags > 0 AND ack = 0 AND (syn / flags) >= 0.9 \
| stats dc(dst_port) AS destination_ports dc(dst_ip) AS destination_hosts sum(syn) AS unanswered_syns values(flow_event_uids) AS event_uids values(flow_lineage_ids) AS lineage_id earliest(_time) AS _time BY src_ip rollup_time_ns \
| where destination_ports > 50 \
| eval rule_id = "R-D-L4-002", risk_score = 55, osi_layer = 4, entity_key = src_ip \
| table _time rule_id risk_score osi_layer entity_key src_ip destination_ports destination_hosts unanswered_syns event_uids lineage_id
action.correlationsearch.enabled = 1
action.correlationsearch.label   = R-D-L4-002

# One predicate with two conclusions. A closed-port sweep and a service outage
# put the same refusals on the wire at the same ratio, so a rule reading only
# the ratio reports them identically and sends the wrong response to one of
# them. What separates them is which side of the refusal fans out, and that is
# readable only because a capture records a refusal with the server as its
# source: the flags land on the reverse flow, so one server refusing many
# clients and many servers refusing one client are opposite fan-outs rather
# than the same one.
#
# Two deliberate departures from the guide's wording, both recorded here.
#
# The threshold is 0.5 rather than 0.8. A connection refused with RST+ACK puts
# exactly two flags on the flow carrying the refusal, so rst/all for it is 0.5,
# and nothing a sweep or an outage produces can reach 0.8 -- the rule as
# written would never fire on either condition it names. Half is what a flow
# carrying refusals and nothing else scores, and a flow that also carried a
# handshake or data scores well below it, so the separation the rule wants is
# the one this threshold makes.
#
# "Many" is ten. The guide gives no number; a rule whose threshold lives only
# in prose is a rule two people implement differently.
#
# risk_score differs by direction on purpose. An outage is an operational
# event that a security queue should see and not be paged for; enumeration is
# a detection. Deduplicate on (rule_id, entity_key, refusal_direction).
[R-D-L4-003 - RST ratio]
enableSched            = 1
cron_schedule          = */5 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time   = -15m@m
realtime_schedule      = 0
schedule_window        = 2
description = Refusals concentrated on one side of a fan-out: one destination refusing many sources is an outage, many destinations refusing one source is closed-port enumeration. Determinism tier D1. Reads the flag counts from TC4FlowStage output.
search = index=behavior_events sourcetype=morpheus:score:l4 \
| stats max(flow_rst) AS rst max(flow_all) AS flags values(event_uid) AS flow_event_uids values(lineage_id) AS flow_lineage_ids earliest(_time) AS _time BY flow_id rollup_time_ns src_ip dst_ip \
| where flags > 0 AND (rst / flags) >= 0.5 \
| eventstats dc(dst_ip) AS clients_refused BY src_ip rollup_time_ns \
| eventstats dc(src_ip) AS servers_refusing BY dst_ip rollup_time_ns \
| eval refusal_direction = case(clients_refused >= 10 AND servers_refusing = 1, "service_outage", servers_refusing >= 10 AND clients_refused = 1, "closed_port_enumeration") \
| where isnotnull(refusal_direction) \
| eval entity_key = if(refusal_direction = "service_outage", src_ip, dst_ip), fan_out = if(refusal_direction = "service_outage", clients_refused, servers_refusing) \
| stats count AS refused_flows max(fan_out) AS counterparties values(flow_event_uids) AS event_uids values(flow_lineage_ids) AS lineage_id earliest(_time) AS _time BY entity_key refusal_direction rollup_time_ns \
| eval rule_id = "R-D-L4-003", osi_layer = 4, risk_score = if(refusal_direction = "closed_port_enumeration", 40, 10) \
| table _time rule_id risk_score osi_layer entity_key refusal_direction counterparties refused_flows event_uids lineage_id
action.correlationsearch.enabled = 1
action.correlationsearch.label   = R-D-L4-003

# A transfer far outside what this pair of endpoints has ever exchanged on this
# port. The baseline is the triple's own, which is the whole of the rule: a
# global threshold on transfer volume has to sit above the busiest pair in the
# estate and is therefore above every exfiltration that pair is not involved
# in. TC4EnvelopeStage carries the envelope, the ratio and the breach flag on
# the row, so this search neither keeps a baseline nor computes a percentile.
#
# No maturity gate, and that is not an omission. The ratio has no denominator
# until the triple has the hundred prior transfers a 99th percentile needs, so
# breached cannot be true before the envelope is mature. Adding the clause
# would suggest the flag means less than it does.
#
# One departure from the guide's wording. It says bpp and total data_len, and
# this fires on either. A bulk exfiltration arriving as a thousand
# ordinary-sized packets leaves bpp exactly where it has always been while
# data_len goes through the roof, which is the common shape and the one
# requiring both would miss. Which envelope broke is on the row, so a single
# oversized transfer and a long ordinary-looking one are distinguishable at a
# glance rather than merged.
[R-B-L4-005 - Transfer envelope breach]
enableSched            = 1
cron_schedule          = */5 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time   = -15m@m
realtime_schedule      = 0
schedule_window        = 2
description = An (src_ip, dst_ip, dst_port) triple transferring more than three times its own 99th percentile. Determinism tier D1. Reads the envelope columns from TC4EnvelopeStage output.
search = index=behavior_events sourcetype=morpheus:score:l4 (flow_data_len_envelope_breached=true OR flow_bpp_envelope_breached=true) \
| eval breached_envelope = case(flow_data_len_envelope_breached = "true" AND flow_bpp_envelope_breached = "true", "volume and shape", flow_data_len_envelope_breached = "true", "volume", true(), "shape") \
| stats max(flow_data_len) AS transferred max(flow_data_len_envelope) AS volume_envelope max(flow_data_len_envelope_ratio) AS volume_ratio max(flow_bpp_envelope_ratio) AS shape_ratio values(breached_envelope) AS breached_envelope values(src_ip) AS src_ip values(dst_ip) AS dst_ip values(event_uid) AS event_uids values(lineage_id) AS lineage_id earliest(_time) AS _time BY transfer_triple \
| eval rule_id = "R-B-L4-005", risk_score = 65, osi_layer = 4, entity_key = transfer_triple \
| table _time rule_id risk_score osi_layer entity_key transfer_triple src_ip dst_ip transferred volume_envelope volume_ratio shape_ratio breached_envelope event_uids lineage_id
action.correlationsearch.enabled = 1
action.correlationsearch.label   = R-B-L4-005

# A managed endpoint that has acquired a TLS stack it has never presented.
# Low volume and high signal: a JA4 fingerprint is a property of the stack
# rather than of the traffic, so a host has a handful and acquires one only
# when something is installed.
#
# ja4_client_observations is not optional and the corpus is why. Every
# fingerprint is new to a host the estate has just started seeing -- a laptop
# back from repair, a new starter, anything behind a fresh lease -- so novelty
# alone reports them identically to a host whose stack has been stable for
# weeks and then changed. The floor of twenty is what "settled" means here; an
# estate with a shorter retention lowers it deliberately rather than inheriting
# a number that reads as caution and is a blind spot.
#
# Permanent recall rather than the rule's thirty days, which is the same
# departure TC3ReachStage makes for destination-network novelty: a host whose
# fourth stack appeared thirty-one days ago is not a host with three stacks,
# and re-alerting because a window rolled is what the window was meant to
# prevent. ja4_client_saturated says when the recall was capped.
[R-B-L6-001 - New TLS client fingerprint]
enableSched            = 1
cron_schedule          = */5 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time   = -15m@m
realtime_schedule      = 0
schedule_window        = 2
description = A host with a settled handshake history presenting a client fingerprint it has never presented before. Determinism tier D1. Reads ja4_client_first_seen and ja4_client_observations from TC6FingerprintStage output.
search = index=behavior_events sourcetype=morpheus:score:l6 ja4_client_first_seen=true ja4_client_observations>=20 \
| stats values(ja4_client) AS new_fingerprints max(ja4_client_distinct) AS distinct_fingerprints max(ja4_client_observations) AS prior_handshakes max(ja4_client_saturated) AS saturated values(dst_ip) AS dst_ip values(event_uid) AS event_uids values(lineage_id) AS lineage_id earliest(_time) AS _time BY src_ip \
| eval rule_id = "R-B-L6-001", risk_score = 55, osi_layer = 6, entity_key = src_ip \
| table _time rule_id risk_score osi_layer entity_key src_ip new_fingerprints distinct_fingerprints prior_handshakes saturated dst_ip event_uids lineage_id
action.correlationsearch.enabled = 1
action.correlationsearch.label   = R-B-L6-001

# A destination presenting an authority it has never presented before. Catches
# interception, including the well-intentioned interception that broke a
# policy.
#
# cert_issuer_distinct=1 is the whole rule, and without it the search is
# unusable. A content delivery host legitimately rotates among several
# authorities, so it differs from its own mode on most handshakes; gating on a
# destination that has only ever presented one issuer removes it entirely. The
# same gate makes the rule self-silencing on a genuine certificate authority
# migration: the first handshake under the new authority fires, and every one
# after it sees a destination that has demonstrably presented two. One notable
# per migration, with no suppression list to maintain.
#
# Deduplicate on (rule_id, dst_ip).
[R-D-L6-002 - Certificate issuer anomaly]
enableSched            = 1
cron_schedule          = */5 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time   = -15m@m
realtime_schedule      = 0
schedule_window        = 2
description = A destination that has only ever presented one certificate authority presenting another. Determinism tier D1. Reads cert_issuer_differs, cert_issuer_distinct and cert_issuer_mature from TC6CertificateStage output.
search = index=behavior_events sourcetype=morpheus:score:l6 cert_issuer_differs=true cert_issuer_mature=true cert_issuer_distinct=1 \
| stats values(certificate_issuer) AS presented_issuer values(cert_issuer_established) AS established_issuer values(src_ip) AS src_ip values(event_uid) AS event_uids values(lineage_id) AS lineage_id earliest(_time) AS _time BY dst_ip \
| eval rule_id = "R-D-L6-002", risk_score = 60, osi_layer = 6, entity_key = dst_ip \
| table _time rule_id risk_score osi_layer entity_key dst_ip presented_issuer established_issuer src_ip event_uids lineage_id
action.correlationsearch.enabled = 1
action.correlationsearch.label   = R-D-L6-002

# A self-signed certificate on a connection that left the estate. Almost always
# either a misconfiguration or attacker infrastructure, and one of two layer 6
# rules that needs no history at all -- it answers on a destination's first
# handshake, where the issuer and cipher rules are still declining.
#
# The internal half is the control and it is not a small one: an estate has
# hundreds of self-signed management interfaces, and a rule reading
# cert_self_signed alone would return all of them. The classification is
# TC3ReachStage's, from parsers/ip.py, so this search holds no copy of the
# reserved range list.
#
# cert_validity_days rides along rather than gating. Short lifetimes are the
# guide's named signal for attacker-generated infrastructure, and where the
# cutoff sits is an estate's question: ninety days is one issuer's normal and a
# red flag in an estate that issues for a year.
[R-D-L6-003 - Self-signed to external destination]
enableSched            = 1
cron_schedule          = */5 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time   = -15m@m
realtime_schedule      = 0
schedule_window        = 2
description = A self-signed certificate presented by a globally routable destination. Determinism tier D1. Reads cert_self_signed_external and cert_validity_days from TC6CertificateStage output.
search = index=behavior_events sourcetype=morpheus:score:l6 cert_self_signed_external=true \
| stats count AS connections min(cert_validity_days) AS shortest_validity_days values(certificate_issuer) AS issuer values(src_ip) AS src_ip values(event_uid) AS event_uids values(lineage_id) AS lineage_id earliest(_time) AS _time BY dst_ip \
| eval rule_id = "R-D-L6-003", risk_score = 50, osi_layer = 6, entity_key = dst_ip \
| table _time rule_id risk_score osi_layer entity_key dst_ip connections shortest_validity_days issuer src_ip event_uids lineage_id
action.correlationsearch.enabled = 1
action.correlationsearch.label   = R-D-L6-003

# A pair negotiating a suite weaker than the weakest it has ever settled on.
# The reference is the pair's own floor rather than a policy, which is what
# makes the rule usable in an estate spanning two decades of operating systems:
# a global threshold either alerts on every legacy appliance forever or sits
# below the downgrade this rule exists to catch.
#
# A minimum rather than a mode, deliberately. A pair that negotiates a modern
# suite nine times in ten has a mode of that suite, and the tenth, weaker,
# entirely routine negotiation sits below it -- so a mode would report the
# estate's own variation as an attack.
#
# The strength ordering is a judgement and lives in
# morpheus.utils.cipher_strength, not here. A suite that table does not
# recognize gets no rank, contributes nothing to any floor, and is counted on
# the row: the health search below is how an estate discovers its feed needs an
# entry rather than discovering it from a rule that quietly never fires.
[R-B-L6-004 - Cipher downgrade]
enableSched            = 1
cron_schedule          = */5 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time   = -15m@m
realtime_schedule      = 0
schedule_window        = 2
description = A source and destination pair negotiating a cipher suite below the pair's own historical floor. Determinism tier D1. Reads cipher_downgraded, cipher_tier and cipher_floor_tier from TC6CipherStage output.
search = index=behavior_events sourcetype=morpheus:score:l6 cipher_downgraded=true cipher_mature=true \
| stats count AS handshakes values(cipher_suite) AS negotiated values(cipher_tier) AS negotiated_tier values(cipher_floor_tier) AS historical_floor values(event_uid) AS event_uids values(lineage_id) AS lineage_id earliest(_time) AS _time BY tls_pair_key src_ip dst_ip \
| eval rule_id = "R-B-L6-004", risk_score = 65, osi_layer = 6, entity_key = src_ip \
| table _time rule_id risk_score osi_layer entity_key tls_pair_key src_ip dst_ip handshakes negotiated negotiated_tier historical_floor event_uids lineage_id
action.correlationsearch.enabled = 1
action.correlationsearch.label   = R-B-L6-004

# Content whose declared type and detected type are different kinds of thing.
# The qualifier is the rule: a declared image detected as a different image
# format is a re-encoding and an estate has thousands of them, while a declared
# image detected as an archive is someone moving a file past a content filter.
# The category map is in morpheus.utils.media_type and is coarse on purpose --
# its only job is to separate those two cases, and a finer split would start
# reporting the first again.
#
# The second layer 6 rule that needs no history, so it answers on the first
# record that carries both types.
[R-D-L6-005 - Content type mismatch]
enableSched            = 1
cron_schedule          = */5 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time   = -15m@m
realtime_schedule      = 0
schedule_window        = 2
description = Declared and detected content types that fall in different categories. Determinism tier D1. Reads content_category_crossed and the two category columns from TC6ContentStage output.
search = index=behavior_events sourcetype=morpheus:score:l6 content_category_crossed=true \
| stats count AS transfers values(content_type_declared) AS declared_type values(content_type_detected) AS detected_type values(content_category_declared) AS declared_category values(content_category_detected) AS detected_category values(event_uid) AS event_uids values(lineage_id) AS lineage_id earliest(_time) AS _time BY src_ip dst_ip \
| eval rule_id = "R-D-L6-005", risk_score = 55, osi_layer = 6, entity_key = src_ip \
| table _time rule_id risk_score osi_layer entity_key src_ip dst_ip transfers declared_type detected_type declared_category detected_category event_uids lineage_id
action.correlationsearch.enabled = 1
action.correlationsearch.label   = R-D-L6-005

# Where the two layer 6 tables stop. Both the cipher ordering and the media
# type map report what they could not place rather than guessing at it, and
# both refusals are silent from a detection's point of view: the rule simply
# does not fire. This is the search that makes the gap visible, and it is an
# operational metric rather than a detection -- its value is in the number.
#
# An estate whose inspection point emits OpenSSL short names rather than IANA
# names will see its entire cipher feed here, which is the intended discovery
# path: the tables translate spelling, not naming schemes.
[TLS table coverage - unrecognized values]
enableSched            = 1
cron_schedule          = 25 * * * *
dispatch.earliest_time = -1h@h
dispatch.latest_time   = -15m@m
realtime_schedule      = 0
schedule_window        = 10
description = How much of the layer 6 feed falls outside the cipher strength ordering and the media type map. Operational metric, not a detection.
search = index=behavior_events sourcetype=morpheus:score:l6 \
| stats count AS handshakes sum(eval(if(cipher_unrecognized="true", 1, 0))) AS unrecognized_ciphers sum(eval(if(content_category_unclassified="true", 1, 0))) AS unclassified_content_types values(eval(if(cipher_unrecognized="true", cipher_suite, null()))) AS unrecognized_suite_names \
| eval unrecognized_cipher_ratio = round(unrecognized_ciphers / handshakes, 4), unclassified_content_ratio = round(unclassified_content_types / handshakes, 4) \
| table handshakes unrecognized_ciphers unrecognized_cipher_ratio unrecognized_suite_names unclassified_content_types unclassified_content_ratio

# DNS tunnelling: a registered domain receiving a stream of random-looking,
# long-labelled names, a new one for every chunk of data. Three conditions and
# all three are required, because each has an ordinary explanation alone --
# entropy alone flags every content delivery network, long labels alone flag
# tenant hostnames that are long hashes, and a hundred distinct subdomains
# alone flags any large SaaS provider.
#
# The conditions are applied to the same queries, which is why the count is
# taken here rather than read off the row. The base search keeps only queries
# clearing entropy and label length and counts distinct subdomains among those.
# The stage's own dns_subdomains_per_domain counts every subdomain, so reading
# it would let a SaaS domain with a hundred ordinary tenant names and one
# random hostname satisfy all three conditions on different traffic. It rides
# on the notable as all_subdomains_in_hour, for context.
#
# Hourly and non-overlapping, because the count is taken over the search's own
# window and the rule's window is an hour. Entropy is measured below the
# registered domain (morpheus.utils.query_entropy): the domain is constant for
# a tunnel, and measured whole, ordinary names sit within a few tenths of the
# threshold.
[R-B-L7-001 - DNS tunneling]
enableSched            = 1
cron_schedule          = 20 * * * *
dispatch.earliest_time = -75m@m
dispatch.latest_time   = -15m@m
realtime_schedule      = 0
schedule_window        = 10
description = A registered domain receiving more than 100 distinct high-entropy, long-labelled subdomains in an hour. Determinism tier D1. Reads the per-query measurements from TC7DnsStage output and counts qualifying subdomains itself.
search = index=behavior_events sourcetype=morpheus:score:l7 dns_subdomain_entropy>4.0 dns_mean_label_length>30 \
| stats dc(dns_subdomain) AS qualifying_subdomains max(dns_subdomains_per_domain) AS all_subdomains_in_hour avg(dns_subdomain_entropy) AS mean_entropy avg(dns_mean_label_length) AS mean_label_length dc(src_ip) AS clients values(src_ip) AS src_ip values(event_uid) AS event_uids values(lineage_id) AS lineage_id earliest(_time) AS _time BY dns_registered_domain \
| where qualifying_subdomains > 100 \
| eval rule_id = "R-B-L7-001", risk_score = 60, osi_layer = 7, entity_key = dns_registered_domain \
| table _time rule_id risk_score osi_layer entity_key dns_registered_domain qualifying_subdomains all_subdomains_in_hour mean_entropy mean_label_length clients src_ip event_uids lineage_id
action.correlationsearch.enabled = 1
action.correlationsearch.label   = R-B-L7-001

# Enumeration: a client walking a server's namespace, asking for everything and
# finding little. Both conditions are required and both are read off the same
# row, so they held over the same ten-minute window: a crawler requests as many
# distinct paths and is refused almost nothing, and a broken client is refused
# constantly on one path.
#
# The ratio is tested as a multiplication, 4xx > 0.7 * 2xx, and this is not a
# stylistic choice. 4xx divided by 2xx is undefined for a client that has had
# no success at all -- the purest enumerator there is, one that has found
# nothing -- so http_4xx_to_2xx_ratio is null on every one of its rows and a
# search thresholding that column would never see it. The two counts are on
# the row for that reason.
#
# Only 2xx and 4xx enter the counts. A redirect is neither a success nor a
# refusal of the path asked for, and a 5xx is about the server. Deduplicate on
# (rule_id, src_ip).
[R-D-L7-005 - Enumeration]
enableSched            = 1
cron_schedule          = */5 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time   = -15m@m
realtime_schedule      = 0
schedule_window        = 2
description = One client requesting more than 200 distinct paths in ten minutes with more than 0.7 client errors for every success. Determinism tier D1. Reads the windowed counts from TC7HttpStage output.
search = index=behavior_events sourcetype=morpheus:score:l7 http_distinct_paths>200 \
| where http_4xx_in_window > 0.7 * http_2xx_in_window \
| stats max(http_distinct_paths) AS distinct_paths max(http_4xx_in_window) AS refusals max(http_2xx_in_window) AS successes values(dst_ip) AS dst_ip values(event_uid) AS event_uids values(lineage_id) AS lineage_id earliest(_time) AS _time BY src_ip \
| eval rule_id = "R-D-L7-005", risk_score = 45, osi_layer = 7, entity_key = src_ip \
| table _time rule_id risk_score osi_layer entity_key src_ip distinct_paths refusals successes dst_ip event_uids lineage_id
action.correlationsearch.enabled = 1
action.correlationsearch.label   = R-D-L7-005

# Bulk data access: a principal's SaaS operation returning more than five
# times their own 30-day 99th percentile for that operation. The baseline is
# the principal's and the operation's together -- an export and a read are
# different scales of one person's normal -- and it is published only after a
# hundred prior operations, because by nearest rank a 99th percentile of fewer
# is simply the largest value ever seen. A failed operation read nothing and is
# never measured.
#
# The target object's data classification, from the TC-0 context store as it
# stood when the operation happened, weights the notable rather than gating it:
# the trigger is the guide's, and the classification sets the severity. An
# object the inventory has never heard of fires at the default severity with
# ctx_object_found=false, rather than being dropped -- an export nobody has
# classified is the one somebody should look at. The search never reads the
# object's name. Deduplicate on (rule_id, user_principal, operation).
[R-B-L7-002 - Bulk data access]
enableSched            = 1
cron_schedule          = */15 * * * *
dispatch.earliest_time = -30m@m
dispatch.latest_time   = -15m@m
realtime_schedule      = 0
schedule_window        = 5
description = A SaaS operation returning more than five times the principal's own 30-day 99th percentile for that operation, weighted by the target object's data classification from the TC-0 context store. Determinism tier D1. Reads TC7SaasStage output enriched by TC0EnrichStage.
search = index=behavior_events sourcetype=morpheus:score:l7 saas_baseline_mature=true saas_record_ratio>5 \
| eval classification = coalesce(ctx_object_data_classification, "unclassified") \
| eval risk_score = case(classification == "restricted", 75, classification == "confidential", 60, classification == "internal", 40, classification == "public", 20, true(), 40) \
| eval rule_id = "R-B-L7-002", osi_layer = 7, entity_key = user_principal \
| table _time rule_id risk_score osi_layer entity_key user_principal operation target_object_type record_count saas_record_baseline saas_record_ratio classification ctx_object_found event_uid lineage_id
action.correlationsearch.enabled = 1
action.correlationsearch.label   = R-B-L7-002

# Access breadth trajectory: the number of distinct object types a principal
# reaches rising for four consecutive weeks while their role assignment stays
# the same. Runs on Monday over the four whole weeks before it, Monday to
# Monday UTC, and reads the drift_* columns TC5DriftStage stamps over weekly
# windows -- the same trajectory measurement as R-P-L5-006, over breadth rather
# than reconstruction error. The role is the principal's group memberships as
# the TC-0 store recorded them at each operation's time: one assignment across
# the four weeks, or the rise is new duties rather than creep. A role change
# recorded late does not count until it is recorded, which is what the rule
# could have known. Predictive, so a watchlist and never a page, as R-P-L5-006
# is. Deduplicate on (rule_id, user_principal).
[R-P-L7-006 - Access breadth trajectory]
enableSched            = 1
cron_schedule          = 30 2 * * 1
dispatch.earliest_time = -4w@w1
dispatch.latest_time   = @w1
realtime_schedule      = 0
schedule_window        = 60
description = Distinct target_object_type count per principal rising across four consecutive weekly windows with the principal's group memberships unchanged. Determinism tier D1. Reads TC7SaasStage's weekly breadth and the drift_* columns TC5DriftStage stamps over weekly windows. Watchlist, never a page.
search = index=behavior_events sourcetype=morpheus:score:l7 saas_object_types_in_week=* \
| eval role = coalesce(ctx_groups, "none") \
| stats max(drift_rising_windows) AS rising_weeks dc(role) AS role_versions values(role) AS role max(saas_object_types_in_week) AS peak_object_types values(week_window_id) AS weeks values(lineage_id) AS lineage_id latest(_time) AS _time BY user_principal \
| where rising_weeks >= 4 AND role_versions = 1 \
| eval rule_id = "R-P-L7-006", risk_score = 20, osi_layer = 7, entity_key = user_principal, action = "watchlist" \
| table _time rule_id risk_score action osi_layer entity_key user_principal rising_weeks peak_object_types role weeks lineage_id
action.correlationsearch.enabled = 1
action.correlationsearch.label   = R-P-L7-006

# More than the permitted number of MAC addresses behind a port designated
# single-host: the classic unauthorized switch or hub. TC2CardinalityStage
# emits macs_per_port with a first-in-window flag; firing only on rows where a
# MAC is new to the window yields one detection per offending MAC rather than
# one per sample, and the row already names the MAC. The designation and the
# permitted count come from the port_designations lookup (transforms.conf),
# which ships header-only: until it is populated from the inventory this rule
# fires on nothing, which is the guide's own statement that it is unusable
# without the list. macs_per_port_saturated is carried so a MAC flood, where
# the count is a lower bound, reads as one. Deduplicate on
# (rule_id, port_key, mac_address).
[R-D-L2-001 - MAC address count exceeded on an access port]
enableSched            = 1
cron_schedule          = */5 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time   = -15m@m
realtime_schedule      = 0
schedule_window        = 2
description = More MAC addresses than permitted behind a port designated single-host. Determinism tier D1. Reads macs_per_port from TC2CardinalityStage output against the port_designations lookup.
search = index=behavior_events sourcetype=morpheus:score:l2 macs_per_port_first_in_window=true \
| lookup port_designations port_key OUTPUT designation max_macs \
| where designation="single-host" AND macs_per_port > coalesce(max_macs, 1) \
| eval rule_id = "R-D-L2-001", risk_score = 40, osi_layer = 2, entity_key = port_key \
| table _time rule_id risk_score osi_layer entity_key port_key mac_address macs_per_port macs_per_port_saturated max_macs site_id switch_id port_id vlan_id event_uid lineage_id
action.correlationsearch.enabled = 1
action.correlationsearch.label   = R-D-L2-001

# One address claimed by more than one MAC inside the window, excluding the
# HSRP and VRRP virtual addresses that legitimately are. The exclusion list is
# pipeline configuration, TC2ArpStage(excluded_sender_ips=[...]), and the stage
# marks each row arp_sender_ip_excluded rather than dropping it, so this search
# honours the list without holding a copy of it and an excluded address is
# visible in the data as excluded rather than absent. One detection per
# contested address per window; the claimant MACs are listed on it.
[R-D-L2-003 - ARP anomaly]
enableSched            = 1
cron_schedule          = */5 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time   = -15m@m
realtime_schedule      = 0
schedule_window        = 2
description = An IP address claimed by more than one MAC address within the window, excluding known first-hop redundancy virtual addresses. Determinism tier D1. Reads macs_claiming_sender_ip and arp_sender_ip_excluded from TC2ArpStage output.
search = index=behavior_events sourcetype=morpheus:score:l2 macs_claiming_sender_ip>1 arp_sender_ip_excluded=false \
| stats earliest(_time) AS _time max(macs_claiming_sender_ip) AS claimants values(arp_sender_mac) AS claimant_macs values(event_uid) AS event_uids values(lineage_id) AS lineage_id BY arp_sender_ip \
| eval rule_id = "R-D-L2-003", risk_score = 55, osi_layer = 2, entity_key = arp_sender_ip \
| table _time rule_id risk_score osi_layer entity_key arp_sender_ip claimants claimant_macs event_uids lineage_id
action.correlationsearch.enabled = 1
action.correlationsearch.label   = R-D-L2-003

# Health check on the soft-join substrate rather than a threat detection. A
# rising unresolved rate means the collector is losing expiry records and every
# attribution it produces is suspect. Fires when more than a fifth of layer 3
# rows in the window could not be resolved against a binding.
[Binding health - unresolved rate]
enableSched            = 1
cron_schedule          = 23 * * * *
dispatch.earliest_time = -75m@m
dispatch.latest_time   = -15m@m
realtime_schedule      = 0
schedule_window        = 10
description = Alert when the BindingResolverStage unresolved rate exceeds 20 percent, which means attributions are becoming guesses.
search = index=behavior_events sourcetype=morpheus:score:l3 \
| stats count AS total count(eval(resolution_method="unresolved")) AS unresolved \
| eval unresolved_rate = round(unresolved / total, 3) \
| where total > 0 AND unresolved_rate > 0.2

# Two successful authentications for one principal from places far enough
# apart, close enough together in time, that nobody could have made the
# journey. TC5TravelStage writes the distance, the elapsed time and the speed;
# the rule is the threshold and nothing more. Only rows it actually measured
# are considered, because travel_status carries eight other values and each of
# them means "no measurement" rather than "no journey".
#
# Two things a tuner should know before touching the threshold. One intrusion
# produces a PAIR of these, not one: the interloper's authentication from
# somewhere else, and then the victim's next authentication from where they
# actually are. Deduplicating on the principal within the window is usually
# what is wanted. And travel_elapsed_floored marks a row whose two
# authentications shared a timestamp, where the speed is computed against a
# one-second floor rather than against zero; the figure is enormous and
# correct, but it is a lower bound on an undefined quantity rather than a
# measurement. Deduplicate on (rule_id, user_principal, window_id).
[R-D-L5-003 - Impossible travel]
enableSched            = 1
cron_schedule          = */5 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time   = -15m@m
realtime_schedule      = 0
schedule_window        = 2
description = One principal authenticated successfully from two places faster than the journey between them can be made. Determinism tier D1. Reads travel_kmh from TC5TravelStage output. kmh_threshold is the guide's 900, above any commercial aircraft; it is a starting point, not a calibrated value.
search = index=behavior_events sourcetype=morpheus:score:l5 travel_status=measured \
| eval kmh_threshold = 900 \
| where travel_kmh >= kmh_threshold \
| eval rule_id = "R-D-L5-003", risk_score = 70, osi_layer = 5, entity_key = user_principal, elapsed_seconds = travel_elapsed_ns / 1000000000 \
| table _time rule_id risk_score osi_layer entity_key user_principal travel_kmh travel_distance_km elapsed_seconds travel_elapsed_floored user_location source_country source_city source_ip app device_id event_uid lineage_id
action.correlationsearch.enabled = 1
action.correlationsearch.label   = R-D-L5-003

# A run of multi-factor denials for one principal, ended by an approval. The
# approval is what makes this actionable rather than merely noisy: failed
# prompts are the most ordinary event in an estate, and the one that was
# eventually accepted is the one where the victim gave in. TC5RiskStage counts
# the challenges and the denials over a ten-minute window and marks the
# approving row.
#
# The denials are counted over the window rather than as an unbroken run,
# because a fatigue attack interleaves with the victim's own traffic and a
# contiguous-run rule misses exactly the case where the victim was working at
# the time. consecutive_mfa_denials is carried so an analyst can see whether
# the run was clean. risk_counts_saturated marks a row whose counts are lower
# bounds, which is what a sustained attack against one principal produces.
# Deduplicate on (rule_id, user_principal, window_id).
[R-D-L5-004 - Multi-factor fatigue]
enableSched            = 1
cron_schedule          = */5 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time   = -15m@m
realtime_schedule      = 0
schedule_window        = 2
description = More multi-factor challenges than a principal should see in ten minutes, enough of them denied, and then an approval. Determinism tier D1. Reads mfa_attempts_in_window, mfa_denials_in_window and mfa_denied_then_approved from TC5RiskStage output. Both thresholds are the guide's and are starting points, not calibrated values.
search = index=behavior_events sourcetype=morpheus:score:l5 mfa_denied_then_approved=true \
| eval challenge_threshold = 5, denial_threshold = 4 \
| where mfa_attempts_in_window > challenge_threshold AND mfa_denials_in_window >= denial_threshold \
| eval rule_id = "R-D-L5-004", risk_score = 75, osi_layer = 5, entity_key = user_principal \
| table _time rule_id risk_score osi_layer entity_key user_principal mfa_attempts_in_window mfa_denials_in_window consecutive_mfa_denials mfa_ratio risk_counts_saturated source_ip source_country app device_id event_uid lineage_id
action.correlationsearch.enabled = 1
action.correlationsearch.label   = R-D-L5-004

# The flagship predictive rule, and the one that should never page. A principal
# whose daily mean reconstruction error has risen for four consecutive days by
# more than one and a half of their own standard deviations, without any day
# crossing the R-B-L5-001 threshold, goes on a watchlist; the layer 7 rules for
# that principal are made more sensitive. TC5DriftStage computes the trajectory
# over complete daily windows -- one observation per principal per day, the mean
# of that day's per-event scores -- and stamps it on every row of the day, so
# the search deduplicates on (user_principal, day_window_id).
#
# The premise behind this rule, that reconstruction error rises during
# reconnaissance and staging, is a hypothesis the guide does not establish and
# this search does not either. On the reference corpus it fires on three
# principals, and each firing is explained in expected_results.json: two are the
# frozen reference parameters meeting cumulative features, one is a burst ending
# a shallow run. None is behaviour. That is what a deployment should expect to
# see first, and why the action is a watchlist rather than a page.
[R-P-L5-006 - Drift trajectory]
enableSched            = 1
cron_schedule          = 15 1 * * *
dispatch.earliest_time = -2d@d
dispatch.latest_time   = -15m@m
realtime_schedule      = 0
schedule_window        = 30
description = A principal's daily mean reconstruction error rising for four consecutive days by more than 1.5 of their own standard deviations, with no day crossing R-B-L5-001. Determinism tier D1. Reads the drift_* columns TC5DriftStage stamps over daily windows. Watchlist, never a page.
search = index=behavior_events sourcetype=morpheus:score:l5 drift_mature=true \
| eval rising_threshold = 4, sigma_threshold = 1.5, mean_ceiling = 2.0 \
| where drift_rising_windows >= rising_threshold AND drift_rise_sigmas > sigma_threshold AND mean_abs_z < mean_ceiling \
| dedup user_principal day_window_id \
| eval rule_id = "R-P-L5-006", risk_score = 20, osi_layer = 5, entity_key = user_principal, action = "watchlist" \
| table _time rule_id risk_score action osi_layer entity_key user_principal day_window_id drift_rising_windows drift_total_rise drift_rise_sigmas drift_baseline_sigma drift_velocity drift_acceleration mean_abs_z max_abs_z event_uid lineage_id
action.correlationsearch.enabled = 1
action.correlationsearch.label   = R-P-L5-006
