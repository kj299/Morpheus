#
# Deploy to search heads. KV Store collections backing the time-bounded binding
# lookups.
#
# The accelerated_fields definitions are not optional. Without them, every
# lookup against a collection holding tens of millions of bucket rows is a
# collection scan, and the chain queries become unusable at exactly the moment
# they are needed.

# One row per (ip, bucket), produced upstream by BindingTable.to_bucketed_frame()
# with bucket_seconds=300 and materialized by the refresh saved search. The
# expansion guarantees exactly one row per key and bucket, so the lookup is
# single-valued. binding_uid is the content-addressed identifier of the exact
# lease behind the row, which is what makes an attribution auditable later.
[binding_l2_l3_collection]
enforceTypes = true
field.ip          = string
field.bucket      = number
field.mac         = string
field.port_id     = string
field.switch_id   = string
field.binding_uid = string
accelerated_fields.by_ip_bucket = {"ip": 1, "bucket": 1}

# Layer 1 bindings are stable for months, so they carry no bucket. Bucketing a
# stable binding multiplies its row count by the retention period for no gain.
[binding_l1_collection]
enforceTypes = true
field.port_id                  = string
field.switch_id                = string
field.site_id                  = string
field.transceiver_serial       = string
field.lldp_neighbor_chassis_id = string
field.binding_uid              = string
accelerated_fields.by_port = {"port_id": 1, "switch_id": 1}
