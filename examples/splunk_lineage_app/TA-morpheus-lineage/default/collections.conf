#
# Deploy to search heads. KV Store collections backing the time-bounded binding
# lookups.
#
# The accelerated_fields definitions are not optional. Without them, every
# lookup against a collection holding tens of millions of bucket rows is a
# collection scan, and the chain queries become unusable at exactly the moment
# they are needed.

# One row per (ip, bucket), produced upstream by BindingTable.to_bucketed_frame()
# with bucket_seconds=300 and materialized by the refresh saved search. The
# expansion guarantees exactly one row per key and bucket, so the lookup is
# single-valued. binding_uid is the content-addressed identifier of the exact
# lease behind the row, which is what makes an attribution auditable later.
[binding_l2_l3_collection]
enforceTypes = true
field.ip          = string
field.bucket      = number
field.mac         = string
field.port_id     = string
field.switch_id   = string
field.binding_uid = string
accelerated_fields.by_ip_bucket = {"ip": 1, "bucket": 1}

# One row per port, holding its latest interval: what is in the port now. No
# bucket, because in an estate where nobody touched an optic this row is the
# correct answer for every instant in the retention period, and bucketing it
# would multiply the whole port count by the retention period to say so.
[binding_l1_collection]
enforceTypes = true
field.port_id                  = string
field.switch_id                = string
field.site_id                  = string
field.transceiver_serial       = string
field.lldp_neighbor_chassis_id = string
field.binding_uid              = string
accelerated_fields.by_port = {"port_id": 1, "switch_id": 1}

# The history beside it: one row per (port, day) for the intervals the
# collection above has overwritten, and for nothing else. A port whose optic
# never changed appears here not at all, which is what keeps a historical layer
# 1 lookup affordable -- the cost is proportional to the changes rather than to
# the estate. Produced by BindingTable.superseded().to_bucketed_frame() with
# bucket_seconds=86400.
#
# The width is a day rather than the 300 seconds layer 2 uses because layer 1
# intervals are months long, and expanding a months-long interval at five
# minutes runs past max_buckets_per_binding before the optic is five weeks old.
# A query resolves through this collection first and falls back to the current
# one, so a miss is the common case and costs a port that never changed nothing.
[binding_l1_history_collection]
enforceTypes = true
field.port_id                  = string
field.switch_id                = string
field.bucket                   = number
field.site_id                  = string
field.transceiver_serial       = string
field.lldp_neighbor_chassis_id = string
field.binding_uid              = string
accelerated_fields.by_port_bucket = {"port_id": 1, "switch_id": 1, "bucket": 1}

# The principals the predictive rules have put on watch. R-P-L5-006 and
# R-P-L7-006 write one row per firing, keyed on principal, rule and window, so
# a re-run overwrites; R-B-L7-002 reads it by principal to raise the severity
# of a watched principal's bulk export; the expiry job drops rows whose
# expires has passed. added and expires are epoch seconds taken from the
# event that put the principal there, not from the clock, so two runs over
# the same events write the same rows.
[principal_watchlist_collection]
enforceTypes = true
field.user_principal = string
field.rule_id        = string
field.reason         = string
field.added          = number
field.expires        = number
accelerated_fields.by_principal = {"user_principal": 1}

# The estate's cabling: one row per link the switches have reported over LLDP,
# keyed on link_key, the port and the neighbour port on the far end of it, with
# when the link was first and last reported. The Topology - LLDP adjacency
# search writes it and merges with what is here, so first_seen survives the
# refresh window moving past it. A re-patch adds a row rather than changing
# one, which is what lets an investigation ask what a port was cabled to then.
[lldp_adjacency_collection]
enforceTypes = true
field.link_key                 = string
field.entity_key               = string
field.site_id                  = string
field.device_id                = string
field.port_id                  = string
field.lldp_neighbor_chassis_id = string
field.lldp_neighbor_port_id    = string
field.first_seen               = number
field.last_seen                = number
accelerated_fields.by_port = {"entity_key": 1}
