title: Agent Process Reads Credential Files
id: 66c4d585-05e6-4803-8820-0c55b4d0f379
status: experimental
description: >-
    An AI coding agent's process tree reads SSH keys, cloud credentials, registry tokens or environment files. Join with egress from the same host within minutes (AAH-003).
    Hunt AAH-003 of examples/agentic_ai_hunting.
references:
    - https://atlas.mitre.org/
    - https://genai.owasp.org/llm-top-10/
author: Morpheus agentic AI hunting examples
date: 2026-11-24
tags:
    - attack.credential-access
    - attack.t1552.001
logsource:
    category: process_creation
detection:
    selection_agent:
        - ParentImage|endswith:
              - '/claude'
              - '\claude.exe'
              - '/codex'
              - '\codex.exe'
              - '/cursor'
              - '\Cursor.exe'
              - '/windsurf'
              - '\Windsurf.exe'
              - '/aider'
              - '/gemini'
        - ParentCommandLine|contains:
              - '@anthropic-ai/claude-code'
              - '@openai/codex'
              - '@google/gemini-cli'
    selection_read:
        CommandLine|contains:
            - '/.ssh/id_'
            - '/.aws/credentials'
            - '/.kube/config'
            - '/.docker/config.json'
            - '/.git-credentials'
            - '/.npmrc'
            - '/.pypirc'
            - '/.netrc'
            - '/.config/gcloud/'
            - '/.azure/'
    condition: selection_agent and selection_read
falsepositives:
    - Deploy tooling that reads a cloud profile on the developer's request
level: medium
