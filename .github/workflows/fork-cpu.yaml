# The fork's own CI: every test the GPU conformance runner names, in CPU execution mode, on an ordinary runner.
#
# Upstream's pr.yaml, removed under audit ruling D6, delegated to NVIDIA's shared workflows and their runners, which
# this fork has no access to, so until this file existed no GitHub Actions run had ever executed the suite here. This job installs the pinned CPU environment
# (ci/scripts/cpu_env/linux-64-cpu.lock, released morpheus-core for its compiled library), overlays the repository's
# Python sources onto it, and runs the two tiers
# ci/scripts/gpu_conformance.sh keeps total, selecting the CPU variant of every mode-parametrized test. The GPU
# variants still need a card and that script; this is the half that does not.

name: Fork CPU tiers

on:
  push:
    branches:
      - 'branch-*'
      - 'claude/**'
  pull_request:
    branches:
      - 'branch-*'
  workflow_dispatch:

concurrency:
  group: 'fork-cpu @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cpu-tiers:
    name: CPU tiers
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # The whole history, so the GPU verdict below can count the commits since the last GPU run.
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # This runner has no GPU. Say so on every run, with how old the GPU verdict is against this code
      # (guide 13, plan item 9); the step only reports, and never fails the run.
      - name: Report the GPU verdict's age
        run: python3 ci/scripts/gpu_verdict.py

      # The SID model and its validation set are the only Git LFS files the tiers read, and they live under
      # models/inventory. Everything else stays a pointer: the fork's other tests build their corpora in code. The
      # objects are cached by the pointers' content, so the 45 MB model is downloaded when it changes rather than
      # on every run, which keeps the job inside the repository's LFS bandwidth.
      - name: Restore the model inventory's LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: model-inventory-lfs-${{ hashFiles('models/inventory/**') }}

      # The repository's .lfsconfig sets fetchexclude = *, and an exclusion wins over an inclusion, so without
      # --exclude="" this pull downloads nothing and exits 0. ls-files marks a file still a pointer with "-", and the
      # step fails on one rather than letting the SID tests find it.
      - name: Fetch the model inventory's LFS files
        run: |
          git lfs install --local
          git lfs pull --exclude="" --include="models/inventory/**"
          git lfs ls-files --include="models/inventory/**"
          ! git lfs ls-files --include="models/inventory/**" | grep -q " - "

      - name: Create the environment
        uses: mamba-org/setup-micromamba@v2
        with:
          # The environment the tests were run in, pinned package by package. Its definition is the cpu-test file key
          # of dependencies.yaml, and ci/scripts/cpu_env/make_lock.py generates this lock from it. A fresh solve on
          # the runner went wrong twice in two different ways (sharded repodata missing dlpack 0.8; a libarrow build
          # without libgflags), which is the argument for installing exactly what was verified.
          micromamba-version: '2.9.0-0'
          environment-name: morpheus
          environment-file: ci/scripts/cpu_env/linux-64-cpu.lock
          cache-environment: true
          init-shell: bash

      - name: Overlay the fork's sources onto the installed package
        shell: bash -el {0}
        run: python ci/scripts/cpu_env/overlay_fork_sources.py "$GITHUB_WORKSPACE"

      - name: Run the CPU tiers
        shell: bash -el {0}
        run: |
          mapfile -t TIERS < <(sed -n '/^TARGETS=(/,/^)/p;/^UNMARKED=(/,/^)/p' ci/scripts/gpu_conformance.sh | grep -E '^\s+tests/' | tr -d ' ')
          echo "${#TIERS[@]} test files"
          export PYTHONPATH="$GITHUB_WORKSPACE/ci/scripts/cpu_env${PYTHONPATH:+:$PYTHONPATH}"
          python -m pytest "${TIERS[@]}" -p gpuless -m "not gpu_mode" --run_slow -q -p no:cacheprovider

      # Rows per second per telemetry and lineage stage, normalized by a calibration workload and compared with
      # ci/artifacts/stage_throughput_baseline.json (guide 13, plan item 15). A stage below half its baseline is a
      # warning and a row in the run's summary; the step never fails the run.
      - name: Measure stage throughput
        if: success() || failure()
        shell: bash -el {0}
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/ci/scripts/cpu_env${PYTHONPATH:+:$PYTHONPATH}"
          python ci/scripts/stage_throughput.py --repeats 3

  # The documentation and the lint (guide 13, plan item 14). A pull request that breaks the documentation build, links
  # to a page that does not exist, writes prose Vale refuses, or adds Python that yapf, isort or pylint refuses fails
  # here. The environment is the test environment plus the documentation tools, defined as the cpu-docs file key of
  # dependencies.yaml and locked by ci/scripts/cpu_env/make_lock.py like the test environment.
  docs-and-lint:
    name: Docs and lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The whole history, so the lint can find where the change left its base branch.
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create the environment
        uses: mamba-org/setup-micromamba@v2
        with:
          micromamba-version: '2.9.0-0'
          environment-name: morpheus-docs
          environment-file: ci/scripts/cpu_env/linux-64-docs.lock
          cache-environment: true
          init-shell: bash

      # An explicit conda list cannot hold a package only pip carries; make_lock.py pins those beside the lock.
      - name: Install what only pip carries
        shell: bash -el {0}
        run: python -m pip install --no-deps -r ci/scripts/cpu_env/linux-64-docs.lock.pip.txt

      - name: Overlay the fork's sources onto the installed package
        shell: bash -el {0}
        run: python ci/scripts/cpu_env/overlay_fork_sources.py "$GITHUB_WORKSPACE"

      - name: Lint the Python the change adds or modifies
        shell: bash -el {0}
        run: ci/scripts/fork_lint.sh "origin/${{ github.base_ref || 'branch-25.10' }}"

      - name: Check the prose and build the documentation
        if: success() || failure()
        shell: bash -el {0}
        run: ci/scripts/fork_docs.sh

